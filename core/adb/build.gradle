plugins {
    id 'com.android.library'
}

android {
    namespace 'com.gamecenter.app.adb'
    compileSdk 35
    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.7.0'
    
    // ADB uses its own TLS context; never install this provider globally.
    implementation 'org.conscrypt:conscrypt-android:2.6.3'
    implementation 'com.github.MuntashirAkon.spake2-java:spake2-android:2.2.1'
    testImplementation 'junit:junit:4.13.2'
}
