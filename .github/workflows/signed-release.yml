name: Signed Release (trusted main)

# Privileged signing is deliberately separated from Cloud Build.  workflow_run
# uses this workflow from the default branch and only receives successful runs
# whose head is main; a tag or manually selected feature branch cannot supply
# the workflow code that runs with the keystore and write token.
on:
  workflow_run:
    workflows: ["Cloud Build (云编译)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Signed Release APK
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check signing configuration
        id: signing-config
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; skipping signed release steps."
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.signing-config.outputs.available == 'true'
        with:
          java-version: 17
          distribution: temurin

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.signing-config.outputs.available == 'true'
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Bootstrap Flutter module
        if: steps.signing-config.outputs.available == 'true'
        working-directory: flutter_module
        run: flutter pub get

      - name: Decode keystore
        if: steps.signing-config.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > gamematrix.jks
          chmod 600 gamematrix.jks

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.signing-config.outputs.available == 'true'
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358

      - name: Cache Gradle
        if: steps.signing-config.outputs.available == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build signed release APK
        if: steps.signing-config.outputs.available == 'true'
        run: >-
          ./gradlew :app:bundlePreinstalledModules :app:generateVersionJson :app:validateReleaseApk
          -PupdateChannel=stable
          -PenableFlutterModuleStore=true
          -Ptarget-platform=android-arm64
          -PenableCatalogSignature=true
          -PcatalogSigningProfile=production
          -PautoBumpVersion=false
          -PautoUploadVps=false
          -PpublishGitHubRelease=false
          --no-parallel --max-workers=1 --stacktrace
        env:
          KEYSTORE_PATH: gamematrix.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GAME_MATRIX_CATALOG_ED25519_PUBLIC_KEYS: ${{ secrets.GAME_MATRIX_CATALOG_ED25519_PUBLIC_KEYS }}

      - name: Detect tag for the tested main commit
        id: release-tag
        if: steps.signing-config.outputs.available == 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$(git tag --points-at "$HEAD_SHA" -l 'v[0-9]*' | head -n 1)"
          if [ -n "$tag" ]; then
            if [[ ! "$tag" =~ ^v[0-9]+([.-][A-Za-z0-9._-]+)*$ ]]; then
              echo "::error::Invalid release tag: $tag"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate user-facing release notes
        if: steps.signing-config.outputs.available == 'true' && steps.release-tag.outputs.tag != ''
        run: >-
          python3 tools/validate_release_notes.py RELEASE_NOTES.md
          --version-file version.properties
          --tag "${{ steps.release-tag.outputs.tag }}"

      - name: Upload signed release APK
        if: steps.signing-config.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: steps.signing-config.outputs.available == 'true' && steps.release-tag.outputs.tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/version.json
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
