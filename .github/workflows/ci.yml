name: CI

on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限原则：限制 GITHUB_TOKEN 的默认权限，防止恶意 PR 滥用
# 修复 GitHub Code Scanning alert #34 (actions/missing-workflow-permissions)
permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
  ANDROID_HOME: ${{ secrets.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

jobs:
  lint-and-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Bootstrap Flutter module
        working-directory: flutter_module
        run: flutter pub get

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Snapshot protected release assets
        run: python scripts/verify_protected_assets.py snapshot

      - name: Verify agent contract and Chinese chess rules
        run: |
          python scripts/verify_agent_contract.py
          python scripts/verify_chinese_chess.py
          python scripts/verify_go.py

      - name: Verify module invariants (static scripts wired per quality plan)
        run: |
          python scripts/verify_adb_discovery.py
          python scripts/verify_adb_entries.py
          python scripts/verify_adb_operations.py
          python scripts/verify_adb_process.py
          python scripts/verify_adb_protocol.py
          python scripts/verify_ai_parity.py
          python scripts/verify_browser.py
          python scripts/verify_isolation.py
          python scripts/verify_preinstalled_modules.py
          python scripts/verify_scrcpy.py
          python scripts/verify_security_clauses.py
          python scripts/verify_ratchet.py

      - name: Verify fix discipline (production diff requires test/guard change)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/verify_fix_discipline.py --base "$PR_BASE_SHA"

      - name: Run lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Run detekt (Kotlin static analysis)
        run: ./gradlew detekt --stacktrace

      - name: Run ktlint (Kotlin lint)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run unit tests
        # §三 欠账补齐：doudizhu（72 单测）/td/ai/tools 模块 src/test 全部进 CI，
        # 杜绝"测试存在但无人跑"的死测试（BL-008 教训）
        run: ./gradlew :app:testDebugUnitTest :core:adb:testDebugUnitTest :core:common:testDebugUnitTest :core:network:testDebugUnitTest :core:update:testDebugUnitTest :module-store:feature:games:games:doudizhu:testDebugUnitTest :module-store:feature:games:games:td:testDebugUnitTest :module-store:feature:tools:ai:testDebugUnitTest :module-store:feature:tools:tools:testDebugUnitTest --stacktrace

      - name: Verify tests did not rewrite release assets
        if: always()
        run: python scripts/verify_protected_assets.py verify

      - name: Coverage report and threshold gate
        # 质量提升计划 §三：门禁真实化——JacocoReport + JacocoCoverageVerification，
        # 起步阈值 0.10（2026-08-30 实测基线 12.03%），终值 70% 按季度爬坡
        run: ./gradlew :app:jacocoTestReport :app:jacocoTestCoverageVerification --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            app/build/reports/coverage/**
            app/build/reports/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  build:
    # Keep this check name stable: main branch protection requires it.
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Bootstrap Flutter module
        working-directory: flutter_module
        run: flutter pub get

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PautoBumpVersion=false --stacktrace

      - name: Build release APK (unsigned, lint-skipped)
        # CI 不签名, 只验证 release 路径能跑通
        run: ./gradlew :app:assembleRelease -PskipReleaseLint=true -PciUnsignedRelease=true -PautoBumpVersion=false --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  androidtest:
    # 质量提升计划 §三 L172：instrumented tests 进 CI。
    # 软门禁（continue-on-error）观察两周，稳定后转硬门禁。
    name: Instrumented Tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
