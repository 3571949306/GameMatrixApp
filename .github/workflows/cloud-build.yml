name: Cloud Build (云编译)

# 触发条件
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release-unsigned
          - release-signed

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
  JAVA_HOME: ${{ matrix.java_home }}
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  # ========================================================
  # Job 1: 完整云编译 (debug + release)
  # ========================================================
  build:
    name: Cloud Build (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java_home: [/usr/lib/jvm/temurin-17-jdk-amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle (复用依赖下载)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK (commandline-tools)
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: 35.0.0
          ndk-version: 26b  # 如不需要 NDK 可删

      # 静态分析 (从原 ci.yml 合并)
      - name: Run detekt
        run: ./gradlew detekt --stacktrace
        continue-on-error: false

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --stacktrace
        continue-on-error: true   # 第一次允许有 baseline 失败

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        continue-on-error: true

      # 编译
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned, lint-skipped)
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease -PskipReleaseLint=true --stacktrace
        continue-on-error: true

      # 单元测试覆盖率
      - name: Generate coverage report
        if: matrix.os != 'windows-latest' || true
        run: ./gradlew :app:createDebugUnitTestCoverageReport --stacktrace || true
        continue-on-error: true

      # ============================================
      # 上传 artifact (核心 — VPS 拉的就是这些)
      # ============================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14   # VPS 拉取窗口

      - name: Upload release APK (unsigned)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            app/build/reports/coverage/**
            app/build/reports/jacoco/**
          if-no-files-found: warn
          retention-days: 14

      # ============================================
      # 通知 openclaw / VPS (可选)
      # ============================================
      - name: Notify VPS (POST to webhook)
        if: success() && github.event_name != 'pull_request'
        run: |
          # 如果 VPS 暴露了 webhook，可以 push 通知
          if [ -n "$VPS_WEBHOOK_URL" ]; then
            curl -X POST "$VPS_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"build_complete\",\"run_id\":\"$GITHUB_RUN_ID\",\"branch\":\"$GITHUB_REF_NAME\",\"commit\":\"$GITHUB_SHA\"}"
          fi
        env:
          VPS_WEBHOOK_URL: ${{ secrets.VPS_WEBHOOK_URL }}

  # ========================================================
  # Job 2: 签名 release (需要 secrets, 失败也不阻塞主 build)
  # ========================================================
  signed-release:
    name: Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch') &&
      env.HAS_KEYSTORE == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Decode keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > gamematrix.jks
          ls -la gamematrix.jks

      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: 35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build signed release APK
        run: >-
          ./gradlew :app:bundlePreinstalledModules :app:generateVersionJson :app:validateReleaseApk
          -PupdateChannel=stable
          -PenableFlutterModuleStore=true
          -Ptarget-platform=android-arm64
          -PenableCatalogSignature=true
          -PcatalogSigningProfile=production
          -PautoBumpVersion=false
          -PautoUploadVps=false
          -PpublishGitHubRelease=false
          --no-parallel --max-workers=1 --stacktrace
        env:
          KEYSTORE_PATH: gamematrix.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GAME_MATRIX_CATALOG_ED25519_PUBLIC_KEYS: ${{ secrets.GAME_MATRIX_CATALOG_ED25519_PUBLIC_KEYS }}

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/version.json
          if-no-files-found: warn
          retention-days: 30

      - name: Validate user-facing release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          python3 tools/validate_release_notes.py RELEASE_NOTES.md
          --version-file version.properties
          --tag "${GITHUB_REF_NAME}"

      - name: Attach to GitHub Release (tag 触发时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/version.json
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
