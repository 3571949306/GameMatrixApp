name: Cloud Build (云编译)

# 触发条件
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release-unsigned

# Cloud builds are intentionally read-only.  Release signing runs in the
# separate workflow_run workflow after a successful main-branch build, so a
# tag or manually selected branch can never execute code with signing secrets.
permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  # ========================================================
  # Job 1: 完整云编译 (debug + release)
  # ========================================================
  build:
    name: Cloud Build (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java_home: [/usr/lib/jvm/temurin-17-jdk-amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Bootstrap Flutter module
        working-directory: flutter_module
        run: flutter pub get

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle (复用依赖下载)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK (commandline-tools)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358

      # 静态分析 (从原 ci.yml 合并)
      - name: Run detekt
        run: ./gradlew detekt --stacktrace
        continue-on-error: false

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # 编译
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PautoBumpVersion=false --stacktrace

      - name: Build release APK (unsigned, lint-skipped)
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease -PskipReleaseLint=true -PciUnsignedRelease=true -PautoBumpVersion=false --stacktrace

      # 单元测试覆盖率
      - name: Generate coverage report
        if: matrix.os != 'windows-latest' || true
        run: ./gradlew :app:createDebugUnitTestCoverageReport --stacktrace || true
        continue-on-error: true

      # ============================================
      # 上传 artifact (核心 — VPS 拉的就是这些)
      # ============================================
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14   # VPS 拉取窗口

      - name: Upload release APK (unsigned)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            app/build/reports/coverage/**
            app/build/reports/jacoco/**
          if-no-files-found: warn
          retention-days: 14

      # ============================================
      # 通知 openclaw / VPS (可选)。仅允许受保护 main 分支的 push 读取
      # webhook secret；tag、手动运行和 PR 的工作流文件可能来自不受信任
      # 的提交，不能让它们接触该 secret。
      # ============================================
      - name: Notify VPS (POST to webhook)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 如果 VPS 暴露了 webhook，可以 push 通知
          if [ -n "$VPS_WEBHOOK_URL" ]; then
            curl -X POST "$VPS_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"build_complete\",\"run_id\":\"$GITHUB_RUN_ID\",\"branch\":\"$GITHUB_REF_NAME\",\"commit\":\"$GITHUB_SHA\"}"
          fi
        env:
          VPS_WEBHOOK_URL: ${{ secrets.VPS_WEBHOOK_URL }}
