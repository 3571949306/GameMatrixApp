name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

# CI never needs to write repository state, release artifacts, or workflow settings.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Bootstrap Flutter module
        working-directory: flutter_module
        run: flutter pub get

      - name: i18n Consistency Check
        run: python scripts/check_i18n.py

      - name: Run Lint and Static Analysis
        run: ./gradlew lintDebug --stacktrace

      - name: Run Local Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK and Dynamic Modules
        run: |
          ./gradlew :module-store:feature:tools:wrongbook:assembleDebug
          ./gradlew :app:bundlePreinstalledModules -PautoBumpVersion=false
          ./gradlew :app:assembleDebug -PautoBumpVersion=false --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
