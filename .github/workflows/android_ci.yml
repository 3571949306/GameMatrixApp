name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Bootstrap Flutter module
        working-directory: flutter_module
        run: flutter pub get

      - name: i18n Consistency Check
        run: python scripts/check_i18n.py

      - name: Run Lint and Static Analysis
        run: ./gradlew lintDebug --stacktrace

      - name: Run Local Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug APK and Dynamic Modules
        run: |
          ./gradlew :module-store:feature:tools:wrongbook:assembleDebug
          ./gradlew :app:bundlePreinstalledModules -PautoBumpVersion=false
          ./gradlew :app:assembleDebug -PautoBumpVersion=false --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
