server {
    listen 80;
    listen 2083 ssl http2;
    server_name ai.tcp0053.shop hk-update.tcp0053.shop hk-ws.tcp0053.shop hk-relay.tcp0053.shop hk-site.tcp0053.shop xui-hk.tcp0053.shop xuihk.tcp0053.shop;

    ssl_certificate     /etc/nginx/ssl/cloudflare_origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ai.tcp0053.shop -> port 8080
    location /ai {
        if ($host = 'ai.tcp0053.shop') {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            break;
        }
        # default: x-ui panel
        proxy_pass https://127.0.0.1:55426;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # hk-update.tcp0053.shop -> port 9000
    location /update {
        if ($host = 'hk-update.tcp0053.shop') {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            break;
        }
        proxy_pass https://127.0.0.1:55426;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # hk-relay.tcp0053.shop -> port 9012
    location /relay {
        if ($host = 'hk-relay.tcp0053.shop') {
            proxy_pass http://127.0.0.1:9012;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            break;
        }
        proxy_pass https://127.0.0.1:55426;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # hk-site.tcp0053.shop -> static files
    location /site {
        if ($host = 'hk-site.tcp0053.shop') {
            root /var/www/site;
            index index.html;
            try_files $uri $uri/ /index.html;
            break;
        }
        proxy_pass https://127.0.0.1:55426;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # hk-ws.tcp0053.shop -> port 18080 (WebSocket)
    location /health {
        if ($host = 'hk-ws.tcp0053.shop') {
            proxy_pass http://127.0.0.1:18080/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
        }
        proxy_pass https://127.0.0.1:55426/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /stats {
        if ($host = 'hk-ws.tcp0053.shop') {
            proxy_pass http://127.0.0.1:18080/stats;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
        }
        proxy_pass https://127.0.0.1:55426/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /test-push {
        if ($host = 'hk-ws.tcp0053.shop') {
            proxy_pass http://127.0.0.1:18080/test-push;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
        }
        proxy_pass https://127.0.0.1:55426/test-push;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /ddz-ws {
        if ($host = 'hk-ws.tcp0053.shop') {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            break;
        }
        proxy_pass https://127.0.0.1:55426/ddz-ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # x-ui sub path
    location /sub {
        proxy_pass https://127.0.0.1:2096/sub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
}
