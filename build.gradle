// Root build.gradle for GameMatrixApp
// 添加: 静态分析 (detekt + ktlint) 应用于所有子项目

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        // Kotlin 2.4.20-RC2 contains the fix for GHSA-r937-wjx7-w2jp / CVE-2026-53914.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20-RC2'
        classpath 'org.jetbrains.kotlin:kotlin-reflect:2.4.20-RC2'
        // Compose Compiler Plugin (Kotlin 2.0+ 内置，版本与 Kotlin 保持一致)
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.20-RC2'
        // Keep the Baseline Profile plugin on the same AndroidX Benchmark
        // train as :macrobenchmark; 1.5.0-rc02 resolves Wire 6.4.0 (GHSA fix).
        classpath 'androidx.baselineprofile:androidx.baselineprofile.gradle.plugin:1.5.0-rc02'
        // KSP 2.x uses an independent version line; 2.3.11 is the current release.
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.11'
        // Hilt 2.58 is the newest plugin line compatible with AGP 8.13;
        // runtime/compiler artifacts are aligned separately below to support
        // Kotlin 2.4 metadata until the project moves to AGP 9.
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.58'
        // Phase 1.1: 静态分析
        classpath 'io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.7'
        // 13.1.0 supports the current KtLint CLI line and its worker isolation.
        classpath 'org.jlleitschuh.gradle:ktlint-gradle:13.1.0'
        // Phase 1.2: 覆盖率
        classpath 'org.jacoco:org.jacoco.core:0.8.12'
        classpath 'org.jacoco:org.jacoco.report:0.8.12'
    }

    configurations.classpath {
        resolutionStrategy {
            force 'com.google.guava:guava:33.5.0-jre'
            force 'io.opentelemetry:opentelemetry-api:1.62.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20-RC2'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.4.20-RC2'
            force 'org.jetbrains.kotlin:kotlin-reflect:2.4.20-RC2'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.20-RC2'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.20-RC2'
            force 'io.netty:netty-common:4.2.17.Final'
            force 'io.netty:netty-buffer:4.2.17.Final'
            force 'io.netty:netty-transport:4.2.17.Final'
            force 'io.netty:netty-resolver:4.2.17.Final'
            force 'io.netty:netty-codec:4.2.17.Final'
            force 'io.netty:netty-codec-http:4.2.17.Final'
            force 'io.netty:netty-codec-http2:4.2.17.Final'
            force 'io.netty:netty-handler:4.2.17.Final'
            force 'io.netty:netty-handler-proxy:4.2.17.Final'
            force 'io.netty:netty-codec-socks:4.2.17.Final'
            force 'io.netty:netty-transport-native-unix-common:4.2.17.Final'
            force 'org.apache.commons:commons-compress:1.28.0'
            force 'org.apache.commons:commons-lang3:3.18.0'
            force 'org.bitbucket.b_c:jose4j:0.9.6'
            force 'org.bouncycastle:bcpg-jdk18on:1.85'
            force 'org.bouncycastle:bcpkix-jdk18on:1.85'
            force 'org.bouncycastle:bcprov-jdk18on:1.85'
            force 'org.bouncycastle:bcutil-jdk18on:1.85'
            force 'org.jdom:jdom2:2.0.6.1'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // Only the pinned SPAKE2 implementation is resolved from JitPack.
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.MuntashirAkon.spake2-java' }
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'com.google.guava:guava:33.5.0-jre'
            force 'com.google.protobuf:protobuf-java:4.27.5'
            force 'com.google.protobuf:protobuf-kotlin:4.27.5'
            force 'com.google.protobuf:protobuf-javalite:4.27.5'
            force 'io.opentelemetry:opentelemetry-api:1.62.0'
            // KtLint is compiled against its own Kotlin compiler line. Do not
            // force the application Kotlin version onto its isolated worker.
            if (!name.toLowerCase().startsWith('ktlint')) {
                force 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20-RC2'
                force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.4.20-RC2'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.20-RC2'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.20-RC2'
            } else {
                // KtLint 1.8.0 still declares Logback 1.3.16.  Keep the
                // isolated worker on the patched 1.5.x line so Dependabot's
                // Logback advisories cannot reappear in the generated SBOM.
                force 'ch.qos.logback:logback-classic:1.5.38'
                force 'ch.qos.logback:logback-core:1.5.38'
            }
            force 'io.netty:netty-common:4.2.17.Final'
            force 'io.netty:netty-buffer:4.2.17.Final'
            force 'io.netty:netty-transport:4.2.17.Final'
            force 'io.netty:netty-resolver:4.2.17.Final'
            force 'io.netty:netty-codec:4.2.17.Final'
            force 'io.netty:netty-codec-http:4.2.17.Final'
            force 'io.netty:netty-codec-http2:4.2.17.Final'
            force 'io.netty:netty-handler:4.2.17.Final'
            force 'io.netty:netty-handler-proxy:4.2.17.Final'
            force 'io.netty:netty-codec-socks:4.2.17.Final'
            force 'io.netty:netty-transport-native-unix-common:4.2.17.Final'
            force 'org.apache.commons:commons-compress:1.28.0'
            force 'org.apache.commons:commons-lang3:3.18.0'
            force 'org.bitbucket.b_c:jose4j:0.9.6'
            force 'org.bouncycastle:bcpg-jdk18on:1.85'
            force 'org.bouncycastle:bcpkix-jdk18on:1.85'
            force 'org.bouncycastle:bcprov-jdk18on:1.85'
            force 'org.bouncycastle:bcutil-jdk18on:1.85'
            force 'org.jdom:jdom2:2.0.6.1'
        }
    }

    // Phase 1.1: 对所有 Kotlin/Java 子项目启用 ktlint
    afterEvaluate {
        if (plugins.hasPlugin("org.jetbrains.kotlin.android") || plugins.hasPlugin("org.jetbrains.kotlin.jvm")) {
            apply plugin: "org.jlleitschuh.gradle.ktlint"
            ktlint {
                // Keep the patched Logback dependency deterministic instead of
                // inheriting a plugin patch release's moving default.
                version = "1.8.0"
            }
        }
    }
}

// Phase 1.1: detekt 全局配置
// 在子项目里再 apply detekt 才能跑 detekt 任务
subprojects {
    afterEvaluate { project ->
        def isAndroidModule = project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")
        def hasKotlinSources = project.file("src/main/java").exists() ||
                               project.file("src/main/kotlin").exists() ||
                               project.file("src/test/java").exists() ||
                               project.file("src/test/kotlin").exists()

        if (isAndroidModule && hasKotlinSources) {
            println "[detekt] Applying detekt to ${project.path}"
            project.apply plugin: "io.gitlab.arturbosch.detekt"

            project.detekt {
                config.setFrom(project.files("$rootDir/config/detekt/detekt.yml"))
                buildUponDefaultConfig = true
                autoCorrect = false
                ignoreFailures = true  // 第一次用 baseline, 不让老项目挂
                allRules = false
            }

            project.tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
                jvmTarget = "17"
            }
            project.tasks.withType(io.gitlab.arturbosch.detekt.DetektCreateBaselineTask).configureEach {
                jvmTarget = "17"
            }
        }
    }
}

// Phase 1.2: 单元测试覆盖率 (JaCoCo)
apply from: "build-logic/jacoco.gradle"
