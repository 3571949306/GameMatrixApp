// feature/vpn/build.gradle
// 此模块编译产物为独立 APK，上传至更新服务器供模块商店下载。
// 不作为主 APK 的一部分编译进 app 模块。

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gamecenter.app.vpn'
    compileSdk 35

    defaultConfig {
        applicationId "com.gamecenter.app.vpn"
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly project(':core:common')

    compileOnly 'androidx.appcompat:appcompat:1.6.1'
    compileOnly 'com.google.android.material:material:1.14.0'
    compileOnly 'androidx.recyclerview:recyclerview:1.3.0'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'androidx.fragment:fragment-ktx:1.5.0'
}