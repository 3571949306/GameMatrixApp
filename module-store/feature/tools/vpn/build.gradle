// feature/vpn/build.gradle
// 此模块编译产物为独立 APK，上传至更新服务器供模块商店下载。
// 不作为主 APK 的一部分编译进 app 模块。

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 与主 APK 使用同一 keystore（gamecenter.jks）签名，确保通过 ModuleSignatureVerifier 校验
def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("keystore.properties")
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace 'com.gamecenter.app.vpn'
    compileSdk 35

    defaultConfig {
        applicationId "com.gamecenter.app.vpn"
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (!releaseSigningProperties.isEmpty()) {
                storeFile rootProject.file(releaseSigningProperties['STORE_FILE'])
                storePassword releaseSigningProperties['STORE_PASSWORD']
                keyAlias releaseSigningProperties['KEY_ALIAS']
                keyPassword releaseSigningProperties['KEY_PASSWORD']
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly project(':core:common')

    compileOnly 'androidx.appcompat:appcompat:1.6.1'
    compileOnly 'com.google.android.material:material:1.9.0'
    compileOnly 'androidx.recyclerview:recyclerview:1.4.0'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'androidx.fragment:fragment-ktx:1.5.0'

    // 安全加密存��：用于 EncryptedSharedPreferences 保�� VPN ��点配置（含密码、UUID 等敏感信息）
    implementation 'androidx.security:security-crypto:1.0.0'
}