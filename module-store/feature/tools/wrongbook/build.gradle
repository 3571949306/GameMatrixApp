plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("keystore.properties")
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace 'com.gamecenter.app.wrongbook'
    compileSdk 35

    defaultConfig {
        applicationId "com.gamecenter.app.wrongbook"
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (!releaseSigningProperties.isEmpty()) {
                storeFile rootProject.file(releaseSigningProperties['STORE_FILE'])
                storePassword releaseSigningProperties['STORE_PASSWORD']
                keyAlias releaseSigningProperties['KEY_ALIAS']
                keyPassword releaseSigningProperties['KEY_PASSWORD']
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    compileOnly project(':core:common')
    compileOnly project(':core:network')
    compileOnly project(':core:moduleloader')
    compileOnly files("${project.rootDir}/app/build/libs/app-classes.jar")
    compileOnly files("${project.rootDir}/app/build/intermediates/compile_and_runtime_not_namespaced_r_class_jar/debug/processDebugResources/R.jar")

    // 错题本 UI 使用 Material3 主题属性，需要资源在模块构建时可见。
    // 这些 AndroidX 库在运行时由模块独立加载，与宿主隔离；
    // 相比 compileOnly 可确保模块 APK 资源自包含、能独立链接。
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation libs.androidx.recyclerview
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.room.runtime
    implementation libs.room.ktx
    compileOnly libs.gson
    compileOnly libs.okhttp

    // ML Kit 本地 OCR（本地模式）
    compileOnly libs.mlkit.text.recognition

    // EXIF 旋转信息读取（图片压缩修正方向）
    implementation libs.androidx.exifinterface

    // EncryptedSharedPreferences（正式版 API Key 加密存储）
    implementation libs.androidx.security.crypto

    // Kotlin 协程（与宿主版本对齐）
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    ksp libs.room.compiler

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.room.testing
}

tasks.matching {
    (it.name.contains("compile") && (it.name.contains("JavaWithJavac") || it.name.contains("Kotlin")))
            || it.name.contains("ksp")
}.configureEach {
    dependsOn(":app:packageAppClasses", ":app:processDebugResources")
}
