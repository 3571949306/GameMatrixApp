plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 与主 APK 使用同一 keystore（gamecenter.jks）签名，确保通过 ModuleSignatureVerifier 校验
def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("keystore.properties")
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}

android {
    namespace 'com.gamecenter.app.ai'
    compileSdk 35

    defaultConfig {
        applicationId "com.gamecenter.app.ai"
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (!releaseSigningProperties.isEmpty()) {
                storeFile rootProject.file(releaseSigningProperties['STORE_FILE'])
                storePassword releaseSigningProperties['STORE_PASSWORD']
                keyAlias releaseSigningProperties['KEY_ALIAS']
                keyPassword releaseSigningProperties['KEY_PASSWORD']
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly project(':core:common')
    compileOnly project(':core:network')
    compileOnly files("${project.rootDir}/app/build/libs/app-classes.jar")
    compileOnly files("${project.rootDir}/app/build/intermediates/compile_and_runtime_not_namespaced_r_class_jar/debug/processDebugResources/R.jar")
    compileOnly 'androidx.room:room-runtime:2.6.1'

    compileOnly 'androidx.appcompat:appcompat:1.7.1'
    compileOnly 'com.google.android.material:material:1.12.0'
    compileOnly 'androidx.recyclerview:recyclerview:1.4.0'
    compileOnly 'androidx.fragment:fragment-ktx:1.5.0'
    compileOnly 'com.google.mediapipe:tasks-genai:0.10.27'
    compileOnly 'androidx.security:security-crypto:1.0.0'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'

    // Kotlin 协程
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Phase 1: MiMo TTS 能力 SDK（AI 助手朗读）
    // 仅当 settings.gradle 中通过 mimo.tts.dir 包含该模块时启用
    if (rootProject.findProject(':modules:capabilities:mimo-tts') != null) {
        compileOnly project(':modules:capabilities:mimo-tts')
    }
}

tasks.matching { it.name.contains("compile") && (it.name.contains("JavaWithJavac") || it.name.contains("Kotlin")) }.configureEach {
    dependsOn(":app:packageAppClasses", ":app:processDebugResources")
}