// Phase 1.2: 单元测试与 Android 测试覆盖率 (JaCoCo)
// 集成到子项目, 跑 :app:testDebugUnitTest / :app:connectedDebugAndroidTest 自动产出 coverage 报告
// 阈值先放开 (只生成报告, 不强制), 等覆盖率提升后再开 verify

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
            // AGP 8.x: testCoverage DSL 已移除，通过 buildTypes 启用覆盖率
            project.android.buildTypes.all { buildType ->
                if (buildType.name == "debug") {
                    buildType.enableUnitTestCoverage = true
                    buildType.enableAndroidTestCoverage = true
                }
            }

            // AGP 8.x: jacoco 版本通过 jacoco 插件 toolVersion 配置
            project.plugins.withType(JacocoPlugin) {
                project.jacoco {
                    toolVersion = rootProject.libs.versions.jacoco.get()
                }
            }
        }
    }
}
