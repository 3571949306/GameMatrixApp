android.useAndroidX=true
android.enableJetifier=false
android.overridePathCheck=true
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.nonTransitiveRClass=true

# Flutter Add-to-App release libraries are stripped by the host app's NDK.
# Keep this aligned with FlutterExtension.ndkVersion when upgrading Flutter.
flutterNdkVersion=28.2.13676358

# Stable GitHub/VPS APKs are ARM64-only and must stay below this release gate.
releaseApkMaxSizeMb=120

# Kotlin daemon Encoding fix for Unicode paths (Chinese directory names)
kotlin.daemon.jvm.options=-Dfile.encoding=UTF-8

# T08: JDK 由环境提供（Android Studio 注入嵌入式 JBR / JAVA_HOME）。
# 2026-08-26: 移除硬编码绝对路径（原 org.gradle.java.home=...Android Studio/jbr），
# 避免非 Windows 或不同安装路径的 CI 因路径不存在直接失败。
# 如命令行构建需要显式指定：设置环境变量 JAVA_HOME 即可覆盖。

# Proxy config commented out on 2026-05-27 (TD-02 fix)
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=10808
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=10808
