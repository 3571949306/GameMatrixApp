rootProject.name = "GameMatrixApp"
include ':app'
include ':core:common'
include ':core:network'
include ':core:update'
// Phase 1: 安全加固模块（证书固定 + SHA-256 强制校验）
include ':core:security'
// Phase 2: 模块宿主框架（ClassLoader 池 + 无泄漏模块加载）
include ':core:module-host'
// Phase 2: 模块加载引擎（DexClassLoader + 验证 + 热更新）
include ':core:moduleloader'
// Phase 2: 模块商店（下载 + 安装 + 版本检查）
include ':core:modulestore'
// Phase 3: 联机公共模块（WebSocket Relay + 房间管理 + 消息协议）
include ':core:online'

// Phase 1: MiMo TTS 能力 SDK（注入 AI 助手）
// 路径从 gradle.properties 或 -P 命令行读取: mimo.tts.dir=/path/to/mimo-tts
// 未配置时跳过该模块，不影响主 App 构建
def mimoTtsDir = providers.gradleProperty('mimo.tts.dir').orNull ?: ''
if (mimoTtsDir) {
    def mimoTtsDirFile = file(mimoTtsDir)
    if (mimoTtsDirFile.exists()) {
        include ':modules:capabilities:mimo-tts'
        project(':modules:capabilities:mimo-tts').projectDir = mimoTtsDirFile
    } else {
        logger.lifecycle("[settings] mimo.tts.dir configured but path does not exist: ${mimoTtsDir}")
        logger.lifecycle("[settings] MiMo TTS module will be SKIPPED. Remove the line or fix the path to enable.")
    }
} else {
    logger.lifecycle("[settings] mimo.tts.dir not configured (set in gradle.properties or -P); MiMo TTS module SKIPPED.")
}

// 模块商店功能模块（英文路径）
include ':module-store:feature:tools:vpn'
include ':module-store:feature:games:games:game2048'
include ':module-store:feature:tools:ai'
include ':module-store:feature:tools:tools'
// Phase 2: AI 错题本模块（复刻 ai_wrongbook）
include ':module-store:feature:tools:wrongbook'
include ':module-store:feature:games:games:hall'
include ':module-store:feature:games:games:chinesechess'
include ':module-store:feature:games:games:klotski'
include ':module-store:feature:games:games:tts'
