pluginManagement {
    def flutterPropertiesFile = file('flutter_module/.android/local.properties')
    if (flutterPropertiesFile.exists()) {
        def flutterProperties = new Properties()
        flutterPropertiesFile.withInputStream { flutterProperties.load(it) }
        def flutterSdkPath = flutterProperties.getProperty('flutter.sdk')
        if (flutterSdkPath) includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
