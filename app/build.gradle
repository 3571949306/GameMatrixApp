        // ===== 本轮加法 Batch 10-4：成就中心圆环进度头部（已解锁/总数 + 百分比 + 等级文案） =====
        buildConfigField "boolean", "ACHIEVEMENT_PROGRESS_RING", "true"

        // ===== 本轮加法 Batch 11-1：游戏 5 星用户评分（卡片右上角徽章 + 详情页评分弹窗，SharedPreferences 持久化） =====
        buildConfigField "boolean", "GAME_RATING_SYSTEM", "true"
        // ===== 本轮加法 Batch 11-2：数据备份与恢复（导出 / 导入 JSON，SAF ACTION_CREATE_DOCUMENT / ACTION_OPEN_DOCUMENT） =====
        buildConfigField "boolean", "DATA_BACKUP_RESTORE", "true"
        // ===== 本轮加法 Batch 11-3：首页今日时长超阈值显示"休息提醒"渐变警示卡片 =====
        buildConfigField "boolean", "HOME_PLAYTIME_REMINDER", "true"
        // ===== 本轮加法 Batch 11-4：收藏置顶（设置开关，开启后已收藏游戏在游戏列表中自动排在前面） =====
        buildConfigField "boolean", "GAME_FAVORITE_REORDER", "true"

        // ===== 本轮加法 Batch 12-1：首页"继续游玩"卡片（基于最近游玩记录，点击直接启动游戏） =====
        buildConfigField "boolean", "HOME_RESUME_GAME_CARD", "true"
        // ===== 本轮加法 Batch 12-2：首页"最近解锁成就"横幅（可关闭，当日不再显示） =====
        buildConfigField "boolean", "ACHIEVEMENT_RECENT_UNLOCKED_BANNER", "true"
        // ===== 本轮加法 Batch 12-3：游戏卡片右上角显示总游玩时长徽章（如"3.2h"） =====
        buildConfigField "boolean", "GAME_PLAY_TIME_BADGE", "true"
        // ===== 本轮加法 Batch 12-4：启动耗时显示（Debug 构建在首页角落小字显示启动毫秒数） =====
        buildConfigField "boolean", "APP_LAUNCH_TIME_DISPLAY", "true"

        // ===== Batch 21 模块商店增强：筛选 / 搜索历史 / 详情增强 =====
        buildConfigField "boolean", "MODULE_STORE_FILTER", "true"
        buildConfigField "boolean", "MODULE_STORE_SEARCH_HISTORY", "true"
        buildConfigField "boolean", "MODULE_STORE_DETAIL_ENHANCE", "true"
        // 模块商店性能优化：内存级缓存消除主线程 N+1 文件 IO（2026-07-22）
        buildConfigField "boolean", "MODULE_STORE_PERF_OPT", "true"

        // ===== 混合架构 P1/P2：远程目录 + 远程 UI 配置 + 区块渲染器 =====
        // 默认开启，关闭后商店退回旧 assets/modules.json + 硬编码布局
        buildConfigField "boolean", "STORE_REMOTE_CATALOG", "true"
        buildConfigField "boolean", "STORE_REMOTE_UI", "true"
        buildConfigField "boolean", "STORE_SECTION_RENDERER", "false"

        // ===== 混合架构 P3：目录签名 + 事务安装 =====
        // 目录信任链由构建参数注入。Flutter-store Release 会强制要求启用验签；
        // 公钥允许配置 1-3 个，以支持无停机密钥轮换，私钥绝不能进入客户端。
        buildConfigField "boolean", "ENABLE_CATALOG_SIGNATURE", catalogSignatureEnabled.toString()
        buildConfigField "String", "CATALOG_ED25519_PUBLIC_KEYS_BASE64", toJavaStringLiteral(catalogEd25519PublicKeys)
        buildConfigField "String", "CATALOG_SIGNING_PROFILE", toJavaStringLiteral(catalogSigningProfile)
        // 事务性安装开关：开启后使用staging/current/last_good/quarantine目录结构
        buildConfigField "boolean", "ENABLE_TRANSACTIONAL_INSTALL", "true"

        // ===== 混合架构 P4：Host UI 完全模块化 =====
        // 动态底部导航开关：开启后底部导航从 ModuleRegistry 的导航贡献动态构建
        buildConfigField "boolean", "ENABLE_P4_DYNAMIC_NAVIGATION", "true"
        // 动态游戏大厅开关：开启后游戏大厅从模块贡献动态构建
        buildConfigField "boolean", "ENABLE_P4_DYNAMIC_GAMES_HALL", "false"
        // 动态工具区开关：开启后工具区从模块贡献动态构建
        buildConfigField "boolean", "ENABLE_P4_DYNAMIC_TOOLS", "true"
        // 用户可在设置中排序或隐藏宿主底部导航；游戏大厅保持强制可见。
        buildConfigField "boolean", "BOTTOM_NAV_CUSTOMIZATION", "true"

        // ===== 混合架构 P5：Store-Owned 更新与回滚 =====
        // 开启后模块更新完全由商店目录驱动，失败时自动回滚
        buildConfigField "boolean", "ENABLE_P5_STORE_OWNED_UPDATE", "true"

        // ===== 混合架构 P6：Unity 模块架构 =====
        // 开启后支持 Unity launcher / content 模块类型
        buildConfigField "boolean", "ENABLE_P6_UNITY_MODULE", "true"

        // Keep the existing API field name for compatibility, but expose only the concise
        // user-facing announcement. Developer history stays in CHANGELOG.md.
        buildConfigField "String", "CHANGELOG", toJavaStringLiteral(readReleaseNotesText())
        buildConfigField "String", "VERSION_CHANNEL", "\"${currentVersionChannel}\""
        buildConfigField "String", "SERVER_URL", toJavaStringLiteral(configuredServerUrl ?: "https://your-server.example.com")
        buildConfigField "String", "RELAY_URL", toJavaStringLiteral(configuredRelayUrl ?: "https://your-server.example.com/api/ddz-relay")
        buildConfigField "String", "WS_URL", toJavaStringLiteral(configuredWsUrl ?: "")
        buildConfigField "String", "FEEDBACK_URL", toJavaStringLiteral(configuredFeedbackUrl ?: "https://your-server.example.com/api/feedback")
        buildConfigField "String", "MIMO_API_KEY", toJavaStringLiteral(configuredMimoApiKey ?: "")
        buildConfigField "String", "MIMO_API_URL", toJavaStringLiteral(configuredMimoApiUrl ?: "https://api.xiaomimimo.com/v1/chat/completions")

        // Derived from SERVER_URL — eliminates hardcoded server URLs in source code
        def _serverBase = configuredServerUrl ?: "https://your-server.example.com"
        buildConfigField "String", "MODULES_URL", toJavaStringLiteral(_serverBase + "/modules.json")
        buildConfigField "String", "DOWNLOAD_BASE_URL", toJavaStringLiteral(_serverBase + "/modules/")
        buildConfigField "String", "MODULE_HOST", "\"${new URI(_serverBase).getHost()}\""
        buildConfigField "String", "GITHUB_RELEASES_URL", toJavaStringLiteral("https://github.com/3571949306/GameMatrixApp/releases")
        // Batch 21: CDN fallback 域名 — 用户在 local.properties 中配置 server.url.fallback 即可启用
        // 未配置时为空字符串，模块下载会自动跳过空 URL
        buildConfigField "String", "DOWNLOAD_FALLBACK_BASE_URL", toJavaStringLiteral(configuredServerFallbackUrl ?: "")
    }

    aaptOptions {
        cruncherEnabled true
        noCompress 'webp'
    }

    // Flutter Add-to-App uses one APK here. Native targets are selected with
    // -Ptarget-platform; staging Release must contain ARM64 and x86_64 so the same
    // signed QA artifact can be exercised on a real device and official emulator.
    splits {
        abi {
            enable false
        }
    }

    buildTypes {
        debug {
            // Debug 包默认开启测试模式：跳过权限说明弹窗、关闭自动更新检查等
            buildConfigField "boolean", "TEST_MODE", "true"
            // Debug 包允许开启 WebView 远程调试（通过设置页开关控制）
            buildConfigField "boolean", "BROWSER_WEBVIEW_DEBUG", "true"
        }
        release {
            // Allows a signed staging Release to coexist with an installed Debug build without
            // deleting user data. Production builds keep the canonical application ID.
            if (useStagingApplicationIdSuffix) {
                applicationIdSuffix ".flutterstaging"
                versionNameSuffix "-flutter-staging"
            }
            // Phase 3.1: 启用 R8 混淆和资源收缩
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // 只有当 keystore 存在时才应用签名配置
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Android 15+ 16KB 页面对齐适配
    // AGP 8.5+ 默认启用 16KB 对齐打包，useLegacyPackaging=false 确保 .so 在 APK 中 16KB 对齐
    // 注意：MediaPipe libllm_inference_engine_jni.so 本身未 16KB 对齐，需等待上游库更新
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // P2.8: 单元测试配置
    // - returnDefaultValues=true: Android Log / Context 等未 mock 方法返回默认值（0/null/false）
    //   而不是抛 RuntimeException，便于测试包含 Log.w 调用的代码路径（如 StoreActionRouter 拒绝分支）
    // - includeAndroidResources=true: Robolectric 测试可读取资源
    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        // 2026-06-23: WIP 收尾后启用严格模式，baseline 锁定历史问题
        // 新引入的 lint 错误会阻塞 CI；warningsAsErrors 仍 false 避免噪音
        abortOnError true
        checkReleaseBuilds !shouldSkipReleaseLint
        warningsAsErrors false
        // 关闭噪音类检查, 集中精力修可执行项
        disable 'UnusedResources', 'AndroidGradlePluginVersion', 'GradleDependency',
                'TrustAllX509TrustManager', 'MissingTranslation', 'HardcodedText', 'ContentDescription'
        // 不让翻译缺失类问题阻塞 CI (568 个是历史债, 长期要逐个补)
        xmlReport true
        htmlReport true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        // Phase 1 Compose 试点：设置页用 Compose 重写
        compose = true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
            assets.srcDirs = ['src/main/assets', generatedVersionAssetDir]
        }
    }
}

