// ============================================================
// Section 1: Version Configuration
// Reads version info from version.properties and local.properties
// ============================================================

def versionPropsFile = file("${rootDir}/version.properties")
def versionFileVersionCode = 1
def versionFileVersionName = "1.0"
def configuredLastStableVersionCode = 0
def configuredLastStableVersionName = ""
def configuredBetaNoticeVersionGap = 3

def localPropsFile = file("${rootDir}/local.properties")
def configuredServerUrl = ""
def configuredRelayUrl = ""
def configuredWsUrl = ""
def configuredFeedbackUrl = ""
def configuredMimoApiKey = ""

if (localPropsFile.exists()) {
    localPropsFile.withReader("UTF-8") { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (line.isEmpty() || line.startsWith("#")) return
            def eq = line.indexOf('=')
            if (eq > 0) {
                def key = line.substring(0, eq).trim()
                def val = line.substring(eq + 1).trim()
                if (key == "server.url") configuredServerUrl = val
                if (key == "relay.url") configuredRelayUrl = val
                if (key == "ws.url") configuredWsUrl = val
                if (key == "feedback.url") configuredFeedbackUrl = val
                if (key == "mimo.api.key") configuredMimoApiKey = val
            }
        }
    }
}

if (versionPropsFile.exists()) {
    versionPropsFile.withReader("UTF-8") { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (line.isEmpty() || line.startsWith("#")) return
            def eq = line.indexOf('=')
            if (eq > 0) {
                def key = line.substring(0, eq).trim()
                def val = line.substring(eq + 1).trim()
                if (key == "versionCode") versionFileVersionCode = val.toInteger()
                if (key == "versionName") versionFileVersionName = val
                if (key == "lastStableVersionCode") configuredLastStableVersionCode = val.toInteger()
                if (key == "lastStableVersionName") configuredLastStableVersionName = val
                if (key == "betaNoticeVersionGap") configuredBetaNoticeVersionGap = val.toInteger()
            }
        }
    }
}

def currentVersionCode = versionFileVersionCode
def currentVersionName = versionFileVersionName
def requestedVersionChannel = (project.findProperty("updateChannel") ?: "beta").toString().trim().toLowerCase()
def normalizeVersionChannel = { String raw, String versionName ->
    if (["stable", "release", "formal", "prod", "production"].contains(raw)) return "stable"
    if (["beta", "test", "debug", "internal"].contains(raw)) return "beta"
    return "beta"
}
def currentVersionChannel = normalizeVersionChannel(requestedVersionChannel, currentVersionName)
def shouldAutoUploadVps = (project.findProperty("autoUploadVps") ?: "false").toString().toBoolean()
def shouldUploadDryRun = (project.findProperty("uploadDryRun") ?: "false").toString().toBoolean()
def shouldSkipUploadVerify = (project.findProperty("skipUploadVerify") ?: "false").toString().toBoolean()
def shouldSkipReleaseLint = (project.findProperty("skipReleaseLint") ?: "false").toString().toBoolean()
def uploadPythonExecutable = (project.findProperty("uploadPython") ?: System.getenv("PYTHON") ?: "python").toString()
def shouldPublishGitHubRelease = (project.findProperty("publishGitHubRelease") ?: "true").toString().toBoolean()
def releaseSigningRequired = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains("release") || normalized.contains("upload")
}
def generatedVersionAssetDir = file("${buildDir}/generated/assets/version")
def lastStableVersionCode = currentVersionChannel == "stable"
        ? currentVersionCode
        : (configuredLastStableVersionCode > 0 ? configuredLastStableVersionCode : currentVersionCode)
def lastStableVersionName = currentVersionChannel == "stable"
        ? currentVersionName
        : (!configuredLastStableVersionName.isEmpty() ? configuredLastStableVersionName : currentVersionName)

def changelogFile = file("${rootDir}/CHANGELOG.md")
def legacyChangelogFile = file("${rootDir}/changelog.txt")

// ============================================================
// Section 2: Helper Functions
// ============================================================

def readChangelogText = {
    def source = changelogFile.exists() ? changelogFile : legacyChangelogFile
    return source.exists() ? source.getText("UTF-8").trim() : ""
}

def readBuildConfigChangelogText = {
    def full = readChangelogText()
    def maxChars = 24000
    if (full.length() <= maxChars) return full
    return full.substring(0, maxChars) + "\n\n... changelog truncated in BuildConfig; full text is bundled in version.json ..."
}

def toJavaStringLiteral = { String value ->
    return "\"" + value
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
            .replace("\r", "")
            .replace("\n", "\\n") + "\""
}

def toJsonString = { String value ->
    return value
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
            .replace("\r", "")
            .replace("\n", "\\n")
}

def buildVersionJsonText = {
    def vc = android.defaultConfig.versionCode
    def vn = android.defaultConfig.versionName
    def channel = currentVersionChannel
    def beta = channel == "beta"
    def apkName = beta ? "app-beta.apk" : "app-release.apk"
    def cl = toJsonString(readChangelogText())
    return "{\n" +
            "  \"versionCode\": ${vc},\n" +
            "  \"versionName\": \"${toJsonString(vn)}\",\n" +
            "  \"channel\": \"${channel}\",\n" +
            "  \"isBeta\": ${beta},\n" +
            "  \"lastStableVersionCode\": ${lastStableVersionCode},\n" +
            "  \"lastStableVersionName\": \"${toJsonString(lastStableVersionName)}\",\n" +
            "  \"betaNoticeVersionGap\": ${configuredBetaNoticeVersionGap},\n" +
            "  \"apkName\": \"${apkName}\",\n" +
            "  \"changelog\": \"${cl}\"\n" +
            "}\n"
}

// ============================================================
// Section 3: Android Configuration
// ============================================================

android {
    namespace "com.gamecenter.app"
    compileSdk 35

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropsFile))
                storeFile rootProject.file(props['STORE_FILE'])
                storePassword props['STORE_PASSWORD']
                keyAlias props['KEY_ALIAS']
                keyPassword props['KEY_PASSWORD']
                // 启用 v1 �?v2 签名方案
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    defaultConfig {
        applicationId "com.gamecenter.app"
        minSdk 24
        targetSdk 35
        versionCode currentVersionCode
        versionName currentVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "zh-rCN", "en"

        // 模块系统配置（T08：框�?APK 体积优化�?
        buildConfigField "boolean", "ENABLE_MODULE_SYSTEM", "true"
        buildConfigField "String", "MODULE_CACHE_DIR", '"modules"'
        buildConfigField "int", "MAX_MODULE_CACHE_SIZE", "200"

        // Phase 1: MiMo TTS 能力注入开关
        buildConfigField "boolean", "ENABLE_MIMO_TTS", "true"

        // 自动化测试模式开关：开启后跳过首次启动权限说明弹窗、简化更新提示等
        buildConfigField "boolean", "TEST_MODE", "false"

        // 五子棋增强功能开关：界面优化、AI增强、先手选择、计时、音效等
        buildConfigField "boolean", "GOMOKU_ENHANCED", "true"

        buildConfigField "String", "CHANGELOG", toJavaStringLiteral(readBuildConfigChangelogText())
        buildConfigField "String", "VERSION_CHANNEL", "\"${currentVersionChannel}\""
        buildConfigField "String", "SERVER_URL", toJavaStringLiteral(configuredServerUrl ?: "https://your-server.example.com")
        buildConfigField "String", "RELAY_URL", toJavaStringLiteral(configuredRelayUrl ?: "https://your-server.example.com/api/ddz-relay")
        buildConfigField "String", "WS_URL", toJavaStringLiteral(configuredWsUrl ?: "")
        buildConfigField "String", "FEEDBACK_URL", toJavaStringLiteral(configuredFeedbackUrl ?: "https://your-server.example.com/api/feedback")
        buildConfigField "String", "MIMO_API_KEY", toJavaStringLiteral(configuredMimoApiKey ?: "")

        // Derived from SERVER_URL — eliminates hardcoded server URLs in source code
        def _serverBase = configuredServerUrl ?: "https://your-server.example.com"
        buildConfigField "String", "MODULES_URL", toJavaStringLiteral(_serverBase + "/modules.json")
        buildConfigField "String", "DOWNLOAD_BASE_URL", toJavaStringLiteral(_serverBase + "/modules/")
        buildConfigField "String", "MODULE_HOST", "\"${new URI(_serverBase).getHost()}\""
        buildConfigField "String", "GITHUB_RELEASES_URL", toJavaStringLiteral("https://github.com/3571949306/GameMatrixApp/releases")
    }

    aaptOptions {
        cruncherEnabled true
        noCompress 'webp'
    }

    // T08: APK 体积优化 - ABI 拆分（减�?Native 库体积约 75%�?
    splits {
        abi {
            // 循环4: 启用 ABI splits, Release 构建只生成 arm64-v8a APK
            // 注意: 如需模拟器测试(x86_64), 临时改回 enable false
            enable true
            reset()
            // 仅保�?arm64-v8a（现代设备，占比 >95%�?
            include "arm64-v8a"
            universalApk false
        }
    }

    buildTypes {
        debug {
            // Debug 包默认开启测试模式：跳过权限说明弹窗、关闭自动更新检查等
            buildConfigField "boolean", "TEST_MODE", "true"
            // Debug 包关闭 ABI 拆分，确保模拟器(x86_64)也能直接安装
            splits.abi.enable = false
        }
        release {
            // Phase 3.1: 启用 R8 混淆和资源收缩
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // 只有当 keystore 存在时才应用签名配置
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Android 15+ 16KB 页面对齐适配
    // AGP 8.5+ 默认启用 16KB 对齐打包，useLegacyPackaging=false 确保 .so 在 APK 中 16KB 对齐
    // 注意：MediaPipe libllm_inference_engine_jni.so 本身未 16KB 对齐，需等待上游库更新
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        // 2026-06-23: WIP 收尾后启用严格模式，baseline 锁定历史问题
        // 新引入的 lint 错误会阻塞 CI；warningsAsErrors 仍 false 避免噪音
        abortOnError true
        checkReleaseBuilds !shouldSkipReleaseLint
        warningsAsErrors false
        // 关闭噪音类检查, 集中精力修可执行项
        disable 'UnusedResources', 'AndroidGradlePluginVersion', 'GradleDependency',
                'TrustAllX509TrustManager', 'MissingTranslation', 'HardcodedText', 'ContentDescription'
        // 不让翻译缺失类问题阻塞 CI (568 个是历史债, 长期要逐个补)
        xmlReport true
        htmlReport true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // Phase 2.2: Room schema 导出到 schemas/ 目录
    // (跟 exportSchema = true 配合使用, KSP 会在 build 时输出 JSON)

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
            assets.srcDirs = ['src/main/assets', generatedVersionAssetDir]
        }
    }
}

