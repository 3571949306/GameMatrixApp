android {
    namespace "com.gamecenter.app"
    compileSdk 36
    // The host packages Flutter's prebuilt native libraries, so the host must
    // select the same installed NDK that Flutter expects for symbol stripping.
    ndkVersion flutterNdkVersion

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropsFile))
                storeFile rootProject.file(props['STORE_FILE'])
                storePassword props['STORE_PASSWORD']
                keyAlias props['KEY_ALIAS']
                keyPassword props['KEY_PASSWORD']
                // 启用 v1 �?v2 签名方案
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    defaultConfig {
        applicationId "com.gamecenter.app"
        minSdk 24
        targetSdk 35
        versionCode currentVersionCode
        versionName currentVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "zh-rCN", "en"
        if (!requestedAndroidAbis.isEmpty()) {
            // Flutter's target selection does not filter every host dependency
            // (for example MediaPipe). Mirror it at the host NDK layer.
            ndk {
                abiFilters.clear()
                abiFilters.addAll(requestedAndroidAbis)
            }
        }

        // 模块系统配置（T08：框�?APK 体积优化�?
        buildConfigField "boolean", "ENABLE_MODULE_SYSTEM", "true"
        // Flutter-first module store stays opt-in until device verification is
        // complete. Test locally with -PenableFlutterModuleStore=true.
        buildConfigField "boolean", "ENABLE_FLUTTER_MODULE_STORE", flutterStoreEnabled.toString()
        buildConfigField "String", "MODULE_CACHE_DIR", '"modules"'
        buildConfigField "int", "MAX_MODULE_CACHE_SIZE", "200"

        // Phase 1: MiMo TTS 能力注入开关
        buildConfigField "boolean", "ENABLE_MIMO_TTS", "true"

        // 自动化测试模式开关：开启后跳过首次启动权限说明弹窗、简化更新提示等
