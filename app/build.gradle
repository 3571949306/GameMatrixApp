baselineProfile {
    automaticGenerationDuringBuild = false
    saveInSrc = true
}

// ============================================================
// Section 5: Version JSON Generation Tasks
// ============================================================

task generateBundledVersionJson {
    inputs.property("versionCode", currentVersionCode)
    inputs.property("versionName", currentVersionName)
    inputs.property("versionChannel", currentVersionChannel)
    inputs.property("lastStableVersionCode", lastStableVersionCode)
    inputs.property("lastStableVersionName", lastStableVersionName)
    inputs.property("betaNoticeVersionGap", configuredBetaNoticeVersionGap)
    inputs.property("releaseNotesText", readReleaseNotesText())
    outputs.file(new File(generatedVersionAssetDir, "version.json"))
    doLast {
        generatedVersionAssetDir.mkdirs()
        new File(generatedVersionAssetDir, "version.json").setText(buildVersionJsonText(), "UTF-8")
        println "Generated bundled version.json: vc=${android.defaultConfig.versionCode}, channel=${currentVersionChannel}"
    }
}

task generateVersionJson {
    dependsOn generateBundledVersionJson, 'assembleRelease'
    inputs.file(file("${buildDir}/outputs/apk/release/app-release.apk"))
    doLast {
        def debugApkDir = file("${buildDir}/outputs/apk/debug")
        def releaseApkDir = file("${buildDir}/outputs/apk/release")
        debugApkDir.mkdirs()
        releaseApkDir.mkdirs()
        new File(debugApkDir, "version.json").setText(buildVersionJsonText(true), "UTF-8")
        new File(releaseApkDir, "version.json").setText(buildVersionJsonText(true), "UTF-8")
        println "Generated version.json: vc=${android.defaultConfig.versionCode}"
    }
}

// ============================================================
// Section 6: Publish & Upload Tasks
// ============================================================

task validateReleaseNotes(type: Exec) {
    group = "verification"
    description = "Validate concise, user-facing release notes before publishing"
    workingDir rootDir

    def validationArgs = [
            file("${rootDir}/tools/validate_release_notes.py").absolutePath,
            releaseNotesFile.absolutePath
    ]
    if (currentVersionChannel == "stable") {
        validationArgs.addAll([
                "--version-file", versionPropsFile.absolutePath
        ])
    }
    commandLine([uploadPythonExecutable] + validationArgs)
}

task validateReleaseApk(type: Exec) {
    group = "verification"
    description = "Build and validate the release APK size, ABI set, and Flutter symbols"
    dependsOn 'assembleRelease'
    workingDir rootDir

    def validationArgs = [
            file("${rootDir}/tools/validate_release_apk.py").absolutePath,
            file("${buildDir}/outputs/apk/release/app-release.apk").absolutePath,
            "--max-size-mb", releaseApkMaxSizeMb
    ]
    if (currentVersionChannel == "stable") {
        validationArgs.addAll(["--expected-abi", "arm64-v8a"])
    }
    commandLine([uploadPythonExecutable] + validationArgs)
}

task uploadReleaseArtifactsToVps(type: Exec) {
    group = "publishing"
    description = "Upload release APK and version.json to the configured update VPS"
    dependsOn generateVersionJson, validateReleaseNotes, validateReleaseApk
    workingDir rootDir

    def uploadChannel = currentVersionChannel == "stable" ? "release" : "beta"
    def args = [
            file("${rootDir}/tools/upload_to_vps.py").absolutePath,
            "--apk", file("${buildDir}/outputs/apk/release/app-release.apk").absolutePath,
            "--version", file("${buildDir}/outputs/apk/release/version.json").absolutePath,
            "--channel", uploadChannel
    ]
    if (shouldUploadDryRun) {
        args.add("--dry-run")
    }
    if (shouldSkipUploadVerify) {
        args.add("--skip-verify")
    }
    commandLine([uploadPythonExecutable] + args)
}

task uploadApkToGitHubRelease {
    group = "publishing"
    description = "Upload APK to GitHub Releases (only for stable channel)"
    dependsOn generateVersionJson, validateReleaseNotes, validateReleaseApk
    doLast {
        if (currentVersionChannel != "stable") {
            println "Skipping GitHub Release upload: only stable channel triggers release"
            return
        }
        if (!shouldPublishGitHubRelease) {
            println "Skipping GitHub Release upload: publishGitHubRelease=false"
            return
        }

        def apkFile = file("${buildDir}/outputs/apk/release/app-release.apk")
        if (!apkFile.exists()) {
            throw new GradleException("APK file not found: ${apkFile.absolutePath}")
        }
        def args = [
                uploadPythonExecutable,
                file("${rootDir}/tools/upload_to_github_release.py").absolutePath,
                "--apk", apkFile.absolutePath,
                "--metadata", file("${buildDir}/outputs/apk/release/version.json").absolutePath,
                "--version-name", currentVersionName,
                "--version-code", android.defaultConfig.versionCode.toString(),
                "--changelog-file", releaseNotesFile.absolutePath
        ]
        println "Uploading APK to GitHub Releases: v${currentVersionName}-vc${android.defaultConfig.versionCode}"
        def process = args.execute()
        process.waitFor()
        if (process.exitValue() != 0) {
            def err = process.errorStream.getText("UTF-8")
            if (err && err.trim()) {
                println "GitHub Release upload error: ${err}"
            }
            throw new GradleException("Failed to upload APK to GitHub Releases")
        }
        println process.inputStream.getText("UTF-8")
    }
}

// AI / maintainer command guide:
// - Normal local compile only: .\gradlew.bat :app:assembleDebug
// - Build and publish beta to VPS only (internal build): .\gradlew.bat :app:buildAndUploadDebugToVps
// - Validate an official ARM64 release locally:
//   .\gradlew.bat :app:validateReleaseApk -PupdateChannel=stable
//       -PenableFlutterModuleStore=true -Ptarget-platform=android-arm64
// - Publish official release (uploads to VPS + GitHub Releases): use the same
//   production flags with :app:buildAndUploadToVpsAndGitHub.
// - Do not change versionName for routine beta uploads; versionCode bumps automatically.
//
// 双版本分发说明：
// - Beta 通道（默认）：仅上传�?VPS，供开�?接受测试�?的用户下�?
// - Stable/Release 通道：同时上传到 VPS �?GitHub Releases
// - App 下载优先级：香港 VPS（主）→ GitHub Releases（备用）；2026-06-19 起 US VPS 已下线
task uploadReleaseToVps {
    group = "publishing"
    description = "Build release APK, generate version.json, and upload both files to the update VPS"
    dependsOn 'validateReleaseApk'
    finalizedBy 'uploadReleaseArtifactsToVps'
}

task buildAndUploadReleaseToVps {
    group = "publishing"
    description = "Build release APK, generate version.json, and upload both files to the update VPS"
    dependsOn 'uploadReleaseToVps'
}

task buildAndUploadToVpsAndGitHub {
    group = "publishing"
    description = "Build, upload to VPS and GitHub Releases (stable channel only)"
    dependsOn 'validateReleaseApk'
    doLast {
        if (currentVersionChannel != "stable") {
            println "Warning: This task is intended for stable releases. Current channel: ${currentVersionChannel}"
        }
    }
    finalizedBy uploadReleaseArtifactsToVps, uploadApkToGitHubRelease
}

// ============================================================
// Section 7: Version Bump & Build Lifecycle
// ============================================================

task bumpVersion {
    doLast {
        def propsFile = file("${rootDir}/version.properties")
        def nextCode = android.defaultConfig.versionCode + 1
        def curName = android.defaultConfig.versionName
        propsFile.setText("# versionCode：内部测试版本号，用于区分每次测试包/云端推送包\n" +
                "versionCode=${nextCode}\n" +
                "# versionName：发布版本号，面向用户展示\n" +
                "versionName=${curName}\n" +
                "# lastStableVersionCode：上一个正式版内部版本号，用于 beta-only 提示判断\n" +
                "lastStableVersionCode=${lastStableVersionCode}\n" +
                "# lastStableVersionName：上一个正式版展示版本号\n" +
                "lastStableVersionName=${lastStableVersionName}\n" +
                "# betaNoticeVersionGap：用户本地版本落后上一个正式版多少个内部版本号时，提示只能接收 beta 或等待正式版\n" +
                "betaNoticeVersionGap=${configuredBetaNoticeVersionGap}\n", "UTF-8")
        println "Version bumped: ${android.defaultConfig.versionCode} -> ${nextCode}"
    }
}

afterEvaluate {
    tasks.named('preBuild').configure { it.dependsOn 'generateBundledVersionJson' }
    tasks.named('assembleDebug').configure {
        def autoBump = (project.findProperty("autoBumpVersion") ?: "true").toString().toBoolean()
        if (shouldAutoUploadVps) {
            if (autoBump) {
                it.finalizedBy 'generateVersionJson', 'uploadReleaseArtifactsToVps', 'bumpVersion'
            } else {
                it.finalizedBy 'generateVersionJson', 'uploadReleaseArtifactsToVps'
            }
        } else {
            if (autoBump) {
                it.finalizedBy 'generateVersionJson', 'bumpVersion'
            }
        }
    }
}

