// ============================================================
// Section 1: Version Configuration
// Reads version info from version.properties and local.properties
// ============================================================

def versionPropsFile = file("${rootDir}/version.properties")
def versionFileVersionCode = 1
def versionFileVersionName = "1.0"
def configuredLastStableVersionCode = 0
def configuredLastStableVersionName = ""
def configuredBetaNoticeVersionGap = 3

def localPropsFile = file("${rootDir}/local.properties")
def configuredServerUrl = ""
def configuredRelayUrl = ""
def configuredWsUrl = ""
def configuredFeedbackUrl = ""
def configuredMimoApiKey = ""
def configuredMimoApiUrl = ""
def configuredServerFallbackUrl = ""

if (localPropsFile.exists()) {
    localPropsFile.withReader("UTF-8") { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (line.isEmpty() || line.startsWith("#")) return
            def eq = line.indexOf('=')
            if (eq > 0) {
                def key = line.substring(0, eq).trim()
                def val = line.substring(eq + 1).trim()
                if (key == "server.url") configuredServerUrl = val
                if (key == "server.url.fallback") configuredServerFallbackUrl = val
                if (key == "relay.url") configuredRelayUrl = val
                if (key == "ws.url") configuredWsUrl = val
                if (key == "feedback.url") configuredFeedbackUrl = val
                if (key == "mimo.api.key") configuredMimoApiKey = val
                if (key == "mimo.api.url") configuredMimoApiUrl = val
            }
        }
    }
}

if (versionPropsFile.exists()) {
    versionPropsFile.withReader("UTF-8") { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (line.isEmpty() || line.startsWith("#")) return
            def eq = line.indexOf('=')
            if (eq > 0) {
                def key = line.substring(0, eq).trim()
                def val = line.substring(eq + 1).trim()
                if (key == "versionCode") versionFileVersionCode = val.toInteger()
                if (key == "versionName") versionFileVersionName = val
                if (key == "lastStableVersionCode") configuredLastStableVersionCode = val.toInteger()
                if (key == "lastStableVersionName") configuredLastStableVersionName = val
                if (key == "betaNoticeVersionGap") configuredBetaNoticeVersionGap = val.toInteger()
            }
        }
    }
}

def currentVersionCode = versionFileVersionCode
def currentVersionName = versionFileVersionName
def requestedVersionChannel = (project.findProperty("updateChannel") ?: "beta").toString().trim().toLowerCase()
def normalizeVersionChannel = { String raw, String versionName ->
    if (["stable", "release", "formal", "prod", "production"].contains(raw)) return "stable"
    if (["beta", "test", "debug", "internal"].contains(raw)) return "beta"
    return "beta"
}
def currentVersionChannel = normalizeVersionChannel(requestedVersionChannel, currentVersionName)
def shouldAutoUploadVps = (project.findProperty("autoUploadVps") ?: "false").toString().toBoolean()
def shouldUploadDryRun = (project.findProperty("uploadDryRun") ?: "false").toString().toBoolean()
def shouldSkipUploadVerify = (project.findProperty("skipUploadVerify") ?: "false").toString().toBoolean()
def shouldSkipReleaseLint = (project.findProperty("skipReleaseLint") ?: "false").toString().toBoolean()
def uploadPythonExecutable = (project.findProperty("uploadPython") ?: System.getenv("PYTHON") ?: "python").toString()
def shouldPublishGitHubRelease = (project.findProperty("publishGitHubRelease") ?: "true").toString().toBoolean()
def flutterStoreEnabled = (project.findProperty("enableFlutterModuleStore") ?: "false").toString().toBoolean()
def flutterNdkVersion = (project.findProperty("flutterNdkVersion") ?: "28.2.13676358").toString().trim()
def releaseApkMaxSizeMb = (project.findProperty("releaseApkMaxSizeMb") ?: "120").toString().trim()
def catalogSignatureEnabled = (project.findProperty("enableCatalogSignature") ?: "false").toString().toBoolean()
def catalogSigningProfile = (project.findProperty("catalogSigningProfile") ?: "development").toString().trim().toLowerCase()
def useStagingApplicationIdSuffix = (
        project.findProperty("stagingApplicationIdSuffix") ?: "false"
).toString().toBoolean()
def flutterTargetPlatforms = (project.findProperty("target-platform") ?: "")
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
def flutterTargetToAndroidAbi = [
        "android-arm"  : "armeabi-v7a",
        "android-arm64": "arm64-v8a",
        "android-x64"  : "x86_64"
]
def unsupportedFlutterTargetPlatforms = flutterTargetPlatforms.findAll {
    !flutterTargetToAndroidAbi.containsKey(it)
}
if (!unsupportedFlutterTargetPlatforms.isEmpty()) {
    throw new GradleException(
            "Unsupported -Ptarget-platform value(s): ${unsupportedFlutterTargetPlatforms.join(', ')}"
    )
}
def requestedAndroidAbis = flutterTargetPlatforms.collect {
    flutterTargetToAndroidAbi[it]
}.unique()
def catalogEd25519PublicKeys = (
        project.findProperty("catalogEd25519PublicKeys")
                ?: System.getenv("GAME_MATRIX_CATALOG_ED25519_PUBLIC_KEYS")
                ?: ""
).toString().trim()
def releaseSigningRequired = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains("release") || normalized.contains("upload")
}
def generatedVersionAssetDir = file("${buildDir}/generated/assets/version")
def lastStableVersionCode = currentVersionChannel == "stable"
        ? currentVersionCode
        : (configuredLastStableVersionCode > 0 ? configuredLastStableVersionCode : currentVersionCode)
def lastStableVersionName = currentVersionChannel == "stable"
        ? currentVersionName
        : (!configuredLastStableVersionName.isEmpty() ? configuredLastStableVersionName : currentVersionName)

def releaseNotesFile = file("${rootDir}/RELEASE_NOTES.md")

// ============================================================
// Section 2: Helper Functions
// ============================================================

def readReleaseNotesText = {
    if (!releaseNotesFile.exists()) {
        throw new GradleException(
                "Missing RELEASE_NOTES.md. User-facing update text must not use the full CHANGELOG.md."
        )
    }
    return releaseNotesFile.getText("UTF-8").trim()
}

def toJavaStringLiteral = { String value ->
    return "\"" + value
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
            .replace("\r", "")
            .replace("\n", "\\n") + "\""
}

def toJsonString = { String value ->
    return value
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
            .replace("\r", "")
            .replace("\n", "\\n")
}

def validateCatalogTrustConfig = {
    if (!catalogSignatureEnabled) return

    def encodedKeys = catalogEd25519PublicKeys
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (encodedKeys.isEmpty()) {
        throw new GradleException(
                "Catalog signature verification is enabled but no Ed25519 public key is configured. " +
                        "Use -PcatalogEd25519PublicKeys=<base64-raw-32-byte-key>[,...] or " +
                        "GAME_MATRIX_CATALOG_ED25519_PUBLIC_KEYS."
        )
    }
    if (encodedKeys.size() > 3 || encodedKeys.toSet().size() != encodedKeys.size()) {
        throw new GradleException("Catalog trust must contain 1-3 unique Ed25519 public keys.")
    }
    encodedKeys.each { encodedKey ->
        try {
            def decoded = java.util.Base64.decoder.decode(encodedKey)
            if (decoded.length != 32) {
                throw new GradleException("Each Catalog Ed25519 public key must decode to exactly 32 bytes.")
            }
            if (decoded.every { it == (byte) 0 }) {
                throw new GradleException("The all-zero Catalog Ed25519 placeholder key is forbidden.")
            }
        } catch (IllegalArgumentException ignored) {
            throw new GradleException("Catalog Ed25519 public keys must be valid standard Base64.")
        }
    }
}

validateCatalogTrustConfig()
if (releaseSigningRequired && currentVersionChannel == "stable") {
    if (!flutterStoreEnabled) {
        throw new GradleException(
                "A stable Release must enable the production Flutter module store with " +
                        "-PenableFlutterModuleStore=true."
        )
    }
    if (flutterTargetPlatforms != ["android-arm64"]) {
        throw new GradleException(
                "A stable Release must be an ARM64-only user APK. Set " +
                        "-Ptarget-platform=android-arm64; build x86_64 separately for emulator QA."
        )
    }
}
if (releaseSigningRequired && flutterStoreEnabled) {
    if (!catalogSignatureEnabled) {
        throw new GradleException(
                "A Release build with the Flutter module store enabled must also set " +
                        "-PenableCatalogSignature=true."
        )
    }
    if (currentVersionChannel == "stable" && catalogSigningProfile != "production") {
        throw new GradleException(
                "A stable Flutter-store Release requires -PcatalogSigningProfile=production."
        )
    }
    if (currentVersionChannel == "stable" && useStagingApplicationIdSuffix) {
        throw new GradleException("A stable Release cannot use the staging application ID suffix.")
    }
    if (useStagingApplicationIdSuffix &&
            !(flutterTargetPlatforms.contains("android-arm64") &&
                    flutterTargetPlatforms.contains("android-x64"))) {
        throw new GradleException(
                "A Flutter staging Release must include both android-arm64 and android-x64 " +
                        "in -Ptarget-platform so the signed artifact can be tested on ARM64 devices " +
                        "and the official x86_64 emulator."
        )
    }
}

def sha256Of = { File artifact ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format('%02x', it) }.join('')
}

def buildVersionJsonText = { boolean includeArtifactIntegrity = false ->
    def vc = android.defaultConfig.versionCode
    def vn = android.defaultConfig.versionName
    def channel = currentVersionChannel
    def beta = channel == "beta"
    def apkName = beta ? "app-beta.apk" : "app-release.apk"
    // Let the JSON encoder escape user-facing release text. Manual string
    // interpolation can leave literal line breaks in `changelog`, which makes
    // the update metadata unreadable by the installed app.
    def payload = new LinkedHashMap<String, Object>()
    payload.versionCode = vc
    payload.versionName = vn
    payload.channel = channel
    payload.isBeta = beta
    payload.lastStableVersionCode = lastStableVersionCode
    payload.lastStableVersionName = lastStableVersionName
    payload.betaNoticeVersionGap = configuredBetaNoticeVersionGap
    payload.apkName = apkName
    payload.githubReleaseTag = "v${vn}-vc${vc}"
    payload.changelog = readReleaseNotesText()
    if (includeArtifactIntegrity) {
        def releaseApk = file("${buildDir}/outputs/apk/release/app-release.apk")
        if (!releaseApk.isFile()) {
            throw new GradleException("Release APK is required before generating publishable version.json")
        }
        payload.fileSize = releaseApk.length()
        payload.sha256 = sha256Of(releaseApk)
    }
    return groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + "\n"
}

