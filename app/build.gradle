// =============================================================================
// 模块预装：把与宿主同证书签名的 Release 模块 APK 打包到 assets/modules/。
// 任务在 mergeAssets 前执行，保证当前构建产物不会携带旧模块。
// 保留 VPS 更新通道：modules.json 的 downloadUrl 仍指向 VPS，versionCode 升级时下载覆盖。
// VPN 模块刻意不预装（合规/分发约束）。
// 注意：当前跳过 ai 模块（其源码有未解决的 Step import 编译错误，待单独修复）。
// =============================================================================
task bundlePreinstalledModules() {
    group = 'build'
    description = '构建、签名并复制预装模块，同时刷新 modules.json 完整性元数据'
    dependsOn ':module-store:feature:tools:wrongbook:assembleRelease'

    def moduleMappings = [
        // [模块项目路径, 源APK名, 目标文件名（与 modules.json 中 fileName 一致）]
        [':module-store:feature:tools:wrongbook', 'wrongbook-release.apk', 'feature_wrongbook_v100.apk']
    ]

    doLast {
        def assetsModulesDir = file("${projectDir}/src/main/assets/modules")
        assetsModulesDir.mkdirs()
        moduleMappings.each { mapping ->
            def modulePath = mapping[0]
            def srcApkName = mapping[1]
            def targetName = mapping[2]
            def moduleProject = rootProject.findProject(modulePath)
            if (moduleProject == null) {
                logger.warn("[preinstall] 模块未包含: ${modulePath}（跳过）")
                return
            }
            def srcApk = file("${moduleProject.buildDir}/outputs/apk/release/${srcApkName}")
            if (!srcApk.exists()) {
                logger.warn("[preinstall] 模块 APK 未构建: ${srcApk}（请先 assembleDebug 该模块，跳过）")
                return
            }
            def dstApk = file("${assetsModulesDir}/${targetName}")
            copy {
                from srcApk
                into assetsModulesDir
                rename { String fileName -> targetName }
            }
            def manifestFile = file("${projectDir}/src/main/assets/modules.json")
            def manifestText = manifestFile.getText('UTF-8')
            def moduleMatcher = manifestText =~ /(?s)(\{\s*"id"\s*:\s*"wrongbook".*?\n\s*\})/
            if (moduleMatcher.find()) {
                def moduleBlock = moduleMatcher.group(1)
                def moduleSha256 = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(srcApk.bytes)
                        .collect { String.format('%02x', it) }
                        .join('')
                def updatedBlock = moduleBlock
                        .replaceFirst(/"fileSize"\s*:\s*\d+/, "\"fileSize\": ${srcApk.length()}")
                        .replaceFirst(/"sha256"\s*:\s*"[^"]*"/, "\"sha256\": \"${moduleSha256}\"")
                if (updatedBlock != moduleBlock) {
                    manifestFile.setText(manifestText.replace(moduleBlock, updatedBlock), 'UTF-8')
                }
            }
            logger.lifecycle("[preinstall] ${targetName} (${srcApk.length()} bytes) 已复制到 assets/modules/")
        }
    }
}

afterEvaluate {
    tasks.named('mergeDebugAssets').configure { it.dependsOn 'bundlePreinstalledModules' }
    tasks.named('mergeReleaseAssets').configure { it.dependsOn 'bundlePreinstalledModules' }
}
