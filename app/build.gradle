// =============================================================================
// 模块预装：把与宿主同证书签名的 Release 模块 APK 打包到 assets/modules/。
// 宿主 Debug/Release 打包默认刷新并内置全部可构建的 feature 模块，避免安装后
// 进入游戏/工具时出现“模块未安装”。专项测试仍只读取现有 assets，不触发模块重打包。
// 保留 VPS 更新通道：modules.json 的 downloadUrl 仍指向 VPS，versionCode 升级时下载覆盖。
// MiMo TTS 仅在通过 mimo.tts.dir 接入时参与构建；browser/breakout 等目录清单条目没有
// 对应仓库模块，不能伪造 APK。ai 模块源码编译已于 2026-06-23 修复（Step 嵌套类已补全）。
// -----------------------------------------------------------------------------
// 用法：
//   普通构建（无发布资产副作用）：./gradlew :app:assembleDebug
//   显式刷新并打包预装模块：
//     ./gradlew :app:assembleDebugWithPreinstalledModules
//     ./gradlew :app:assembleReleaseWithPreinstalledModules
//   显式刷新但跳过模块编译：追加 -PskipModuleBuild=true
//     - 不再依赖模块 assembleRelease 任务
//     - 模块 APK 缺失时，自动从预构建产物目录 app/build/prebuilt-modules/ 拷贝
//     - 预构建产物目录约定：app/build/prebuilt-modules/<srcApkName>
//       （例如 app/build/prebuilt-modules/chinesechess-release.apk）
// =============================================================================
task bundlePreinstalledModules() {
    group = 'build'
    description = '构建、签名并复制预装模块，同时刷新 modules.json 完整性元数据'
    // skipModuleBuild=true 时跳过所有模块的编译依赖，直接使用已有预构建 APK 产物
    def skipModuleBuild = project.hasProperty('skipModuleBuild') && project.findProperty('skipModuleBuild') == 'true'
    // 所有仓库内 feature 模块均构建 Release 后预装；可选的 MiMo TTS 由 settings.gradle
    // 按路径存在性决定是否加入，清单中没有实现的模块不会被伪造。
    if (!skipModuleBuild) {
        dependsOn ':module-store:feature:tools:ai:assembleRelease'
        dependsOn ':module-store:feature:tools:wrongbook:assembleRelease'
        dependsOn ':module-store:feature:tools:tools:assembleRelease'
        dependsOn ':module-store:feature:tools:vpn:assembleRelease'
        // 游戏模块仍需构建以刷新 catalog.json/modules.json 的 sha256/fileSize 元数据
        dependsOn ':module-store:feature:games:games:chinesechess:assembleRelease'
        dependsOn ':module-store:feature:games:games:game2048:assembleRelease'
        dependsOn ':module-store:feature:games:games:klotski:assembleRelease'
        dependsOn ':module-store:feature:games:games:snake:assembleRelease'
        dependsOn ':module-store:feature:games:games:tic:assembleRelease'
        dependsOn ':module-store:feature:games:games:whack:assembleRelease'
        dependsOn ':module-store:feature:games:games:reaction:assembleRelease'
        dependsOn ':module-store:feature:games:games:rock:assembleRelease'
        dependsOn ':module-store:feature:games:games:dice:assembleRelease'
        dependsOn ':module-store:feature:games:games:guess:assembleRelease'
        dependsOn ':module-store:feature:games:games:tiles:assembleRelease'
        dependsOn ':module-store:feature:games:games:memory:assembleRelease'
        dependsOn ':module-store:feature:games:games:match:assembleRelease'
        dependsOn ':module-store:feature:games:games:blackjack:assembleRelease'
        dependsOn ':module-store:feature:games:games:flappy:assembleRelease'
        dependsOn ':module-store:feature:games:games:brotato:assembleRelease'
        dependsOn ':module-store:feature:games:games:plane:assembleRelease'
        dependsOn ':module-store:feature:games:games:pipeline:assembleRelease'
        dependsOn ':module-store:feature:games:games:sokoban:assembleRelease'
        dependsOn ':module-store:feature:games:games:minesweeper:assembleRelease'
        dependsOn ':module-store:feature:games:games:tetris:assembleRelease'
        dependsOn ':module-store:feature:games:games:sudoku:assembleRelease'
        dependsOn ':module-store:feature:games:games:go:assembleRelease'
        dependsOn ':module-store:feature:games:games:checkers:assembleRelease'
        dependsOn ':module-store:feature:games:games:gomoku:assembleRelease'
        dependsOn ':module-store:feature:games:games:doudizhu:assembleRelease'
        dependsOn ':module-store:feature:games:games:td:assembleRelease'
    }

    // 所有已纳入 settings.gradle 的 feature 模块都复制到 assets/modules/，并同步清单完整性元数据。
    def moduleMappings = [
        // [模块项目路径, 源APK名, 目标文件名, catalog id, 是否预装到assets]
        // 工具模块：全部预装
        [':module-store:feature:tools:ai', 'ai-release.apk', 'feature_ai_v100.apk', 'ai', true],
        [':module-store:feature:tools:wrongbook', 'wrongbook-release.apk', 'feature_wrongbook_v100.apk', 'wrongbook', true],
        [':module-store:feature:tools:tools', 'tools-release.apk', 'feature_tools_v100.apk', 'tools', true],
        [':module-store:feature:tools:vpn', 'vpn-release.apk', 'vpn-release.apk', 'vpn', true],
        // 游戏模块：全部预装
        [':module-store:feature:games:games:chinesechess', 'chinesechess-release.apk', 'game_chinesechess_v300.apk', 'chinesechess', true],
        [':module-store:feature:games:games:game2048', 'game2048-release.apk', 'game_2048_v100.apk', 'game_2048', true],
        [':module-store:feature:games:games:klotski', 'klotski-release.apk', 'game_klotski_v100.apk', 'klotski', true],
        [':module-store:feature:games:games:snake', 'snake-release.apk', 'game_snake_v100.apk', 'snake', true],
        [':module-store:feature:games:games:tic', 'tic-release.apk', 'game_tic_v100.apk', 'tic', true],
        [':module-store:feature:games:games:whack', 'whack-release.apk', 'game_whack_v100.apk', 'whack', true],
        [':module-store:feature:games:games:reaction', 'reaction-release.apk', 'game_reaction_v100.apk', 'reaction', true],
        [':module-store:feature:games:games:rock', 'rock-release.apk', 'game_rock_v100.apk', 'rock', true],
        [':module-store:feature:games:games:dice', 'dice-release.apk', 'game_dice_v100.apk', 'dice', true],
        [':module-store:feature:games:games:guess', 'guess-release.apk', 'game_guess_v100.apk', 'guess', true],
        [':module-store:feature:games:games:tiles', 'tiles-release.apk', 'game_tiles_v100.apk', 'tiles', true],
        [':module-store:feature:games:games:memory', 'memory-release.apk', 'game_memory_v100.apk', 'memory', true],
        [':module-store:feature:games:games:match', 'match-release.apk', 'game_match_v100.apk', 'match', true],
        [':module-store:feature:games:games:blackjack', 'blackjack-release.apk', 'game_blackjack_v100.apk', 'blackjack', true],
        [':module-store:feature:games:games:flappy', 'flappy-release.apk', 'game_flappy_v100.apk', 'flappy', true],
        [':module-store:feature:games:games:brotato', 'brotato-release.apk', 'game_brotato_v100.apk', 'brotato', true],
        [':module-store:feature:games:games:plane', 'plane-release.apk', 'game_plane_v100.apk', 'plane', true],
        [':module-store:feature:games:games:pipeline', 'pipeline-release.apk', 'game_pipeline_v100.apk', 'pipeline', true],
        [':module-store:feature:games:games:sokoban', 'sokoban-release.apk', 'game_sokoban_v100.apk', 'sokoban', true],
        [':module-store:feature:games:games:minesweeper', 'minesweeper-release.apk', 'game_minesweeper_v100.apk', 'minesweeper', true],
        [':module-store:feature:games:games:tetris', 'tetris-release.apk', 'game_tetris_v100.apk', 'tetris', true],
        [':module-store:feature:games:games:sudoku', 'sudoku-release.apk', 'game_sudoku_v100.apk', 'sudoku', true],
        [':module-store:feature:games:games:go', 'go-release.apk', 'game_go_v100.apk', 'go', true],
        [':module-store:feature:games:games:checkers', 'checkers-release.apk', 'game_checkers_v100.apk', 'checkers', true],
        [':module-store:feature:games:games:gomoku', 'gomoku-release.apk', 'game_gomoku_v100.apk', 'gomoku', true],
        [':module-store:feature:games:games:doudizhu', 'doudizhu-release.apk', 'game_doudizhu_v100.apk', 'doudizhu', true],
        [':module-store:feature:games:games:td', 'td-release.apk', 'game_td_v100.apk', 'td', true]
    ]

    doLast {
        def assetsModulesDir = file("${projectDir}/src/main/assets/modules")
        assetsModulesDir.mkdirs()
        moduleMappings.each { mapping ->
            def modulePath = mapping[0]
            def srcApkName = mapping[1]
            def targetName = mapping[2]
            def catalogId = mapping[3]
            def shouldPreinstall = mapping[4]
            def moduleProject = rootProject.findProject(modulePath)
            if (moduleProject == null) {
                logger.warn("[preinstall] 模块未包含: ${modulePath}（跳过）")
                return
            }
            def srcApk = file("${moduleProject.buildDir}/outputs/apk/release/${srcApkName}")
            if (!srcApk.exists()) {
                // skipModuleBuild=true 时回退到预构建产物目录 app/build/prebuilt-modules/<srcApkName>
                def prebuiltApk = file("${projectDir}/build/prebuilt-modules/${srcApkName}")
                if (skipModuleBuild && prebuiltApk.exists()) {
                    srcApk = prebuiltApk
                    logger.lifecycle("[preinstall] 使用预构建产物: ${prebuiltApk}（skipModuleBuild=true）")
                } else {
                    logger.warn("[preinstall] 模块 APK 未构建: ${srcApk}（请先 assembleRelease 该模块，或放置预构建产物到 ${prebuiltApk}，跳过）")
                    return
                }
            }
            // 仅预装模块复制到 assets/modules/；非预装模块只刷新元数据
            if (shouldPreinstall) {
                copy {
                    from srcApk
                    into assetsModulesDir
                    rename { String fileName -> targetName }
                }
            }
            // 无论是否预装，都更新 modules.json 和 catalog.json 中的 fileSize 和 sha256
            def moduleSha256 = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(srcApk.bytes)
                    .collect { String.format('%02x', it) }
                    .join('')
            [file("${projectDir}/src/main/assets/modules.json"),
             file("${projectDir}/src/main/assets/catalog.json")].each { manifestFile ->
                if (!manifestFile.exists()) return
                def manifestText = manifestFile.getText('UTF-8')
                def moduleMatcher = manifestText =~ /(?s)(\{\s*"id"\s*:\s*"${catalogId}".*?\n\s*\})/
                if (moduleMatcher.find()) {
                    def moduleBlock = moduleMatcher.group(1)
                    def updatedBlock = moduleBlock
                            .replaceAll(/"fileSize"\s*:\s*\d+/, "\"fileSize\": ${srcApk.length()}")
                            .replaceAll(/"sha256"\s*:\s*"[^"]*"/, "\"sha256\": \"${moduleSha256}\"")
                    // 同时更新 package 子对象中的 fileSize 和 sha256
                    if (updatedBlock.contains('"package"')) {
                        updatedBlock = updatedBlock.replaceAll(
                                /"package"\s*:\s*\{[^}]*"fileSize"\s*:\s*\d+/,
                                { match -> match.replaceAll(/"fileSize"\s*:\s*\d+/, "\"fileSize\": ${srcApk.length()}") }
                        )
                        updatedBlock = updatedBlock.replaceAll(
                                /"package"\s*:\s*\{[^}]*"sha256"\s*:\s*"[^"]*"/,
                                { match -> match.replaceAll(/"sha256"\s*:\s*"[^"]*"/, "\"sha256\": \"${moduleSha256}\"") }
                        )
                    }
                    if (updatedBlock != moduleBlock) {
                        manifestFile.setText(manifestText.replace(moduleBlock, updatedBlock), 'UTF-8')
                    }
                }
            }
            if (shouldPreinstall) {
                logger.lifecycle("[preinstall] ${targetName} (${srcApk.length()} bytes, sha256=${moduleSha256}) 已复制到 assets/modules/")
            } else {
                logger.lifecycle("[catalog] ${targetName} (${srcApk.length()} bytes, sha256=${moduleSha256}) 元数据已刷新（不预装，通过模块商店下载）")
            }
        }
    }
}

tasks.register('assembleDebugWithPreinstalledModules') {
    group = 'build'
    description = '显式刷新预装模块和目录元数据后构建 Debug APK'
}

tasks.register('assembleReleaseWithPreinstalledModules') {
    group = 'build'
    description = '显式刷新预装模块和目录元数据后构建 Release APK'
}

afterEvaluate {
    def preinstalledModules = tasks.named('bundlePreinstalledModules')

    // 只有显式生命周期任务把 bundlePreinstalledModules 加入任务图。
    // mustRunAfter 只在两者同时入图时排序，不会让普通 merge/test 隐式触发模块打包。
    tasks.named('mergeDebugAssets').configure { it.mustRunAfter preinstalledModules }
    tasks.named('mergeReleaseAssets').configure { it.mustRunAfter preinstalledModules }

    tasks.named('assembleDebugWithPreinstalledModules').configure {
        it.dependsOn preinstalledModules, tasks.named('assembleDebug')
    }
    tasks.named('assembleReleaseWithPreinstalledModules').configure {
        it.dependsOn preinstalledModules, tasks.named('assembleRelease')
    }

    // 默认宿主打包也必须携带全部 feature 模块；否则开发者执行普通 assembleDebug
    // 时会得到一个能启动但在模块商店中显示“未安装”的宿主 APK。
    tasks.named('assembleDebug').configure { it.dependsOn preinstalledModules }
    tasks.named('assembleRelease').configure { it.dependsOn preinstalledModules }
}

// ===== JaCoCo 覆盖率门禁（质量提升计划 §三 L149/L170：门禁真实化）=====
// AGP enableUnitTestCoverage 产出 exec；本块消费之，硬 UI/生成代码不计入核心域口径。
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.11"
}

ext.jacocoExcludes = [
        'androidx/**', 'com/google/**',
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
        '**/*_Factory.*', '**/*_MembersInjector.*', '**/Dagger*.*',
        '**/*_Impl*.*',
        '**/dagger/**', '**/hilt/**', '**/room/**',
        '**/ui/**',
        '**/activity/**', '**/fragment/**', '**/view/**', '**/widget/**',
        '**/*Activity.*', '**/*Activity$*.*', '**/*Fragment.*', '**/*Fragment$*.*',
        '**/*Binding.*', '**/*BindingImpl.*',
        '**/flutter/**',
]

def jacocoExecFiles = fileTree(dir: "${buildDir}/outputs/unit_test_code_coverage", include: '**/*.exec')
def jacocoClassDirs = files([
        fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: jacocoExcludes),
        fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: jacocoExcludes),
])
def jacocoSrcDirs = files(['src/main/java', 'src/main/kotlin'])

tasks.register('jacocoTestReport', JacocoReport) {
    group = 'Reporting'
    description = 'Debug 单测覆盖率报告（核心域口径，硬 UI 与生成代码已排除）'
    dependsOn 'testDebugUnitTest'
    executionData jacocoExecFiles
    classDirectories.setFrom(jacocoClassDirs)
    sourceDirectories.setFrom(jacocoSrcDirs)
    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = file("${buildDir}/reports/jacoco/jacocoTestReport/jacocoTestReport.xml")
    }
}

// 起步阈值 0.10：2026-08-30 实测基线 LINE 12.03%（ jacocoTestReport，排除硬 UI/生成代码后
// 分母 8,887 行），取略低于基线值防抖红；-PcoverageMinRatio 可覆盖；终值 70% 按季度爬坡。
def coverageMinRatio = (project.findProperty('coverageMinRatio') ?: '0.10').toString().toBigDecimal()

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    group = 'Verification'
    description = "覆盖率阈值门禁（LINE COVEREDRATIO >= ${coverageMinRatio}）"
    dependsOn 'testDebugUnitTest'
    executionData jacocoExecFiles
    classDirectories.setFrom(jacocoClassDirs)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = coverageMinRatio
            }
        }
    }
}
