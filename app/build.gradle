android {
    namespace "com.gamecenter.app"
    compileSdk 36
    // The host packages Flutter's prebuilt native libraries, so the host must
    // select the same installed NDK that Flutter expects for symbol stripping.
    ndkVersion flutterNdkVersion

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropsFile))
                // P1-8: 密码外置到环境变量。支持两种形式：
                //   1) keystore.properties 中写 ${System.env.XXX} 引用（解析为对应环境变量）
                //   2) 直接回退到同名环境变量（keystore.properties 值为空时生效）
                def resolveSecret = { String key, String envVar ->
                    def raw = props[key]
                    if (raw != null && !raw.isEmpty()) {
                        def m = raw =~ /^\$\{System\.env\.(\w+)\}$/
                        if (m.matches()) {
                            return System.env[m.group(1)] ?: ''
                        }
                        return raw
                    }
                    return System.env[envVar] ?: ''
                }
                storeFile rootProject.file(props['STORE_FILE'])
                storePassword resolveSecret('STORE_PASSWORD', 'GAMECENTER_STORE_PASSWORD')
                keyAlias props['KEY_ALIAS']
                keyPassword resolveSecret('KEY_PASSWORD', 'GAMECENTER_KEY_PASSWORD')
                // 启用 v1、v2 签名方案
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    defaultConfig {
        applicationId "com.gamecenter.app"
        minSdk 24
        targetSdk 35
        versionCode currentVersionCode
        versionName currentVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "zh-rCN", "en"
        if (!requestedAndroidAbis.isEmpty()) {
            // Flutter's target selection does not filter every host dependency
            // (for example MediaPipe). Mirror it at the host NDK layer.
            ndk {
                abiFilters.clear()
                abiFilters.addAll(requestedAndroidAbis)
            }
        }

        // Flutter-first module store stays opt-in until device verification is
        // complete. Test locally with -PenableFlutterModuleStore=true.
        buildConfigField "boolean", "ENABLE_FLUTTER_MODULE_STORE", flutterStoreEnabled.toString()
        buildConfigField "String", "MODULE_CACHE_DIR", '"modules"'
        buildConfigField "int", "MAX_MODULE_CACHE_SIZE", "200"

        // Phase 1: MiMo TTS 能力注入开关
        buildConfigField "boolean", "ENABLE_MIMO_TTS", "true"

        // 自动化测试模式开关：开启后跳过首次启动权限说明弹窗、简化更新提示等
        buildConfigField "boolean", "TEST_MODE", "false"

        // Phase 2: AI 错题本模块开关（预装）
        buildConfigField "boolean", "ENABLE_WRONGBOOK", "true"

        // 错题本后端代理模式开关：开启后启用百度OCR+智谱GLM后端代理通道
        buildConfigField "boolean", "WRONGBOOK_BACKEND_PROXY", "true"

        // 错题本正式版直连密钥安全存储开关：开启后允许在设置页输入百度/智谱 API Key（EncryptedSharedPreferences 加密保存）
        buildConfigField "boolean", "WRONGBOOK_SECURE_API_CONFIG", "true"

        // 浏览器模块功能开关
        buildConfigField "boolean", "BROWSER_SECURITY_POLICY", "true"
        buildConfigField "boolean", "BROWSER_JS_BRIDGE_ENABLED", "false"
        buildConfigField "boolean", "BROWSER_WEBVIEW_DEBUG", "false"

        // ===== Batch 13：浏览器模块全面优化（2026-07-19） =====
        // 左右滑动手势导航（左边缘右滑后退 / 右边缘左滑前进，带视觉反馈）
