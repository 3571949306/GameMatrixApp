    // Phase 1 Compose 试点：开启 Kotlin Compose Compiler 插件（Kotlin 2.0+ 内置）
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.baselineprofile'
    // Phase 1.3: kapt 已完全删除 (Glide 编译期类生成器未使用, Hilt/Room 走 KSP)
