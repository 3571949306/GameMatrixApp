// ============================================================
// Section 1: Version Configuration
// Reads version info from version.properties and local.properties
// ============================================================

def versionPropsFile = file("${rootDir}/version.properties")
def versionFileVersionCode = 1
def versionFileVersionName = "1.0"
def configuredLastStableVersionCode = 0
def configuredLastStableVersionName = ""
def configuredBetaNoticeVersionGap = 3

def localPropsFile = file("${rootDir}/local.properties")
def configuredServerUrl = ""
def configuredRelayUrl = ""
def configuredWsUrl = ""
def configuredFeedbackUrl = ""
def configuredMimoApiKey = ""
def configuredMimoApiUrl = ""

if (localPropsFile.exists()) {
    localPropsFile.withReader("UTF-8") { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (line.isEmpty() || line.startsWith("#")) return
            def eq = line.indexOf('=')
            if (eq > 0) {
                def key = line.substring(0, eq).trim()
                def val = line.substring(eq + 1).trim()
                if (key == "server.url") configuredServerUrl = val
                if (key == "relay.url") configuredRelayUrl = val
                if (key == "ws.url") configuredWsUrl = val
                if (key == "feedback.url") configuredFeedbackUrl = val
                if (key == "mimo.api.key") configuredMimoApiKey = val
                if (key == "mimo.api.url") configuredMimoApiUrl = val
            }
        }
    }
}

if (versionPropsFile.exists()) {
    versionPropsFile.withReader("UTF-8") { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (line.isEmpty() || line.startsWith("#")) return
            def eq = line.indexOf('=')
            if (eq > 0) {
                def key = line.substring(0, eq).trim()
                def val = line.substring(eq + 1).trim()
                if (key == "versionCode") versionFileVersionCode = val.toInteger()
                if (key == "versionName") versionFileVersionName = val
                if (key == "lastStableVersionCode") configuredLastStableVersionCode = val.toInteger()
                if (key == "lastStableVersionName") configuredLastStableVersionName = val
                if (key == "betaNoticeVersionGap") configuredBetaNoticeVersionGap = val.toInteger()
            }
        }
    }
}

def currentVersionCode = versionFileVersionCode
def currentVersionName = versionFileVersionName
def requestedVersionChannel = (project.findProperty("updateChannel") ?: "beta").toString().trim().toLowerCase()
def normalizeVersionChannel = { String raw, String versionName ->
    if (["stable", "release", "formal", "prod", "production"].contains(raw)) return "stable"
    if (["beta", "test", "debug", "internal"].contains(raw)) return "beta"
    return "beta"
}
def currentVersionChannel = normalizeVersionChannel(requestedVersionChannel, currentVersionName)
def shouldAutoUploadVps = (project.findProperty("autoUploadVps") ?: "false").toString().toBoolean()
def shouldUploadDryRun = (project.findProperty("uploadDryRun") ?: "false").toString().toBoolean()
def shouldSkipUploadVerify = (project.findProperty("skipUploadVerify") ?: "false").toString().toBoolean()
def shouldSkipReleaseLint = (project.findProperty("skipReleaseLint") ?: "false").toString().toBoolean()
def uploadPythonExecutable = (project.findProperty("uploadPython") ?: System.getenv("PYTHON") ?: "python").toString()
def shouldPublishGitHubRelease = (project.findProperty("publishGitHubRelease") ?: "true").toString().toBoolean()
def releaseSigningRequired = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains("release") || normalized.contains("upload")
}
def generatedVersionAssetDir = file("${buildDir}/generated/assets/version")
def lastStableVersionCode = currentVersionChannel == "stable"
        ? currentVersionCode
        : (configuredLastStableVersionCode > 0 ? configuredLastStableVersionCode : currentVersionCode)
def lastStableVersionName = currentVersionChannel == "stable"
        ? currentVersionName
        : (!configuredLastStableVersionName.isEmpty() ? configuredLastStableVersionName : currentVersionName)

def changelogFile = file("${rootDir}/CHANGELOG.md")
def legacyChangelogFile = file("${rootDir}/changelog.txt")

// ============================================================
// Section 2: Helper Functions
// ============================================================

def readChangelogText = {
    def source = changelogFile.exists() ? changelogFile : legacyChangelogFile
    return source.exists() ? source.getText("UTF-8").trim() : ""
}

def readBuildConfigChangelogText = {
    def full = readChangelogText()
    def maxChars = 24000
    if (full.length() <= maxChars) return full
    return full.substring(0, maxChars) + "\n\n... changelog truncated in BuildConfig; full text is bundled in version.json ..."
}

def toJavaStringLiteral = { String value ->
    return "\"" + value
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
            .replace("\r", "")
            .replace("\n", "\\n") + "\""
}

def toJsonString = { String value ->
    return value
            .replace("\\", "\\\\")
            .replace("\"", "\\\"")
            .replace("\r", "")
            .replace("\n", "\\n")
}

def buildVersionJsonText = {
    def vc = android.defaultConfig.versionCode
    def vn = android.defaultConfig.versionName
    def channel = currentVersionChannel
    def beta = channel == "beta"
    def apkName = beta ? "app-beta.apk" : "app-release.apk"
    def cl = toJsonString(readChangelogText())
    return "{\n" +
            "  \"versionCode\": ${vc},\n" +
            "  \"versionName\": \"${toJsonString(vn)}\",\n" +
            "  \"channel\": \"${channel}\",\n" +
            "  \"isBeta\": ${beta},\n" +
            "  \"lastStableVersionCode\": ${lastStableVersionCode},\n" +
            "  \"lastStableVersionName\": \"${toJsonString(lastStableVersionName)}\",\n" +
            "  \"betaNoticeVersionGap\": ${configuredBetaNoticeVersionGap},\n" +
            "  \"apkName\": \"${apkName}\",\n" +
            "  \"changelog\": \"${cl}\"\n" +
            "}\n"
}

