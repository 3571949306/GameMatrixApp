<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浏览器首页</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 20px; }
.search-box { background: white; border-radius: 24px; padding: 12px 20px; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 24px; }
.search-box input { border: none; outline: none; flex: 1; font-size: 16px; }
.shortcuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.shortcut { background: white; border-radius: 12px; padding: 16px; text-align: center; text-decoration: none; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.shortcut:hover { background: #f0f0f0; }
.shortcut .icon { font-size: 28px; margin-bottom: 8px; }
.shortcut .name { font-size: 12px; }
.section-title { font-size: 14px; color: #999; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索或输入网址" onkeypress="if(event.keyCode==13)doSearch()">
</div>
<div class="section-title">常用网站</div>
<div class="shortcuts">
<a class="shortcut" href="https://www.baidu.com"><div class="icon">🔍</div><div class="name">百度</div></a>
<a class="shortcut" href="https://www.qq.com"><div class="icon">💬</div><div class="name">腾讯</div></a>
<a class="shortcut" href="https://www.taobao.com"><div class="icon">🛒</div><div class="name">淘宝</div></a>
<a class="shortcut" href="https://www.bilibili.com"><div class="icon">📺</div><div class="name">B站</div></a>
<a class="shortcut" href="https://www.zhihu.com"><div class="icon">❓</div><div class="name">知乎</div></a>
<a class="shortcut" href="https://www.douyin.com"><div class="icon">🎵</div><div class="name">抖音</div></a>
<a class="shortcut" href="https://www.jd.com"><div class="icon">🏪</div><div class="name">京东</div></a>
<a class="shortcut" href="https://www.weibo.com"><div class="icon">📢</div><div class="name">微博</div></a>
</div>
<script>
function doSearch() {
    var input = document.getElementById('searchInput').value.trim();
    if (!input) return;
    if (input.startsWith('http://') || input.startsWith('https://')) { window.location.href = input; }
    else if (input.includes('.') && !input.includes(' ')) { window.location.href = 'https://' + input; }
    else { window.location.href = 'https://www.baidu.com/s?wd=' + encodeURIComponent(input); }
}
</script>
</body>
</html>
